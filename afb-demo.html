nt(p.item)+'\">'+esc(p.name)+'</a></td>' +\n          '<td>'+esc(p.format)+'</td>' +\n          '<td class=\"num\">'+p.caseQty+'</td>' +\n          '<td class=\"num\"><label class=\"skip\" for=\"c'+p.item+'\">Cases of '+esc(p.name)+'</label>' +\n            '<input id=\"c'+p.item+'\" type=\"text\" inputmode=\"numeric\" value=\"'+r.cases+'\" ' +\n            'data-cases=\"'+p.item+'\" style=\"width:4.5rem;text-align:right;padding:.3rem .4rem\"></td>' +\n          '<td class=\"num\">'+(p.caseWeightOz * r.cases / 16).toFixed(1)+' lb</td>' +\n          '<td><button class=\"linkbtn\" type=\"button\" data-remove=\"'+p.item+'\">Remove</button></td></tr>';\n      }).join(\"\") + '</tbody></table></div>' +\n      '<div class=\"totals\"><div><span>Lines</span><span>'+rows.length+'</span></div>' +\n        '<div><span>Cases</span><span>'+cases+'</span></div>' +\n        '<div class=\"grand\"><span>Est. weight</span><span>'+lbs.toFixed(0)+' lb</span></div></div>' +\n      '<section class=\"band\" style=\"border-top:1px solid var(--rule);margin-top:2rem\">' +\n      '<span class=\"eyebrow\">Send it</span><h2>Who are we quoting?</h2>' +\n      '<div class=\"panel\" style=\"margin-top:1.25rem\"><form id=\"quoteform\" novalidate><div class=\"formgrid\">' +\n        f(\"Company\",\"company\",\"text\",true) +\n        f(\"Contact name\",\"name\",\"text\",true) +\n        f(\"Email\",\"email\",\"email\",true) +\n        f(\"Phone\",\"phone\",\"tel\",true) +\n        '<div class=\"field\"><label for=\"type\">Business type</label><select id=\"type\">' +\n          ['Supermarket chain','Independent grocer','Distributor','Restaurant / foodservice',\n           'Hotel','Airline','Other'].map(function(o){ return '<option>'+o+'</option>'; }).join(\"\") +\n          '</select></div>' +\n        '<div class=\"field\"><label for=\"cadence\">How often you\\'d order</label><select id=\"cadence\">' +\n          ['Weekly','Every two weeks','Monthly','Seasonal / promotional','Still deciding']\n            .map(function(o){ return '<option>'+o+'</option>'; }).join(\"\") + '</select></div>' +\n        '<div class=\"field full\"><label for=\"qnotes\">Anything else</label>' +\n          '<textarea id=\"qnotes\" placeholder=\"Private label, custom pack sizes, delivery windows, target price points\"></textarea></div>' +\n      '</div><button class=\"btn\" type=\"submit\">Send quote request</button>' +\n      '<p class=\"count\" style=\"margin-top:.75rem\" id=\"err\" role=\"alert\"></p>' +\n      '</form></div></section>';\n  }\n\n  /* ---------------- shared ---------------- */\n  function emptyBlock(h, p, href, cta){\n    return '<div class=\"empty\" style=\"margin-top:2rem\"><h3>'+h+'</h3><p>'+p+'</p>' +\n      '<a class=\"btn ghost\" href=\"'+href+'\">'+cta+'</a></div>';\n  }\n  function lab(t,id){ return '<label for=\"'+id+'\">'+t+'</label>'; }\n  function f(t,id,type,req){\n    return '<div class=\"field\">'+lab(t,id)+'<input id=\"'+id+'\" name=\"'+id+'\" type=\"'+type+'\"'+(req?' required':'')+'></div>';\n  }\n\n  function wire(){\n    document.querySelectorAll(\"[data-qty]\").forEach(function(i){\n      i.addEventListener(\"change\", function(){\n        var n = Math.max(0, parseInt(i.value,10) || 0);\n        var c = AFB.cart().filter(function(r){ return r.item !== i.dataset.qty || n > 0; });\n        c.forEach(function(r){ if (r.item === i.dataset.qty) r.qty = n; });\n        AFB.saveCart(c); render();\n      });\n    });\n    document.querySelectorAll(\"[data-cases]\").forEach(function(i){\n      i.addEventListener(\"change\", function(){\n        var n = Math.max(0, parseInt(i.value,10) || 0);\n        var q = AFB.quote().filter(function(r){ return r.item !== i.dataset.cases || n > 0; });\n        q.forEach(function(r){ if (r.item === i.dataset.cases) r.cases = n; });\n        AFB.saveQuote(q); render();\n      });\n    });\n    document.querySelectorAll(\"[data-remove]\").forEach(function(b){\n      b.addEventListener(\"click\", function(){\n        var id = b.dataset.remove;\n        if (AFB.getMode() === \"wholesale\"){\n          AFB.saveQuote(AFB.quote().filter(function(r){ return r.item !== id; }));\n        } else {\n          AFB.saveCart(AFB.cart().filter(function(r){ return r.item !== id; }));\n        }\n        render();\n      });\n    });\n\n    var qcsv = document.getElementById(\"qcsv\");\n    if (qcsv) qcsv.addEventListener(\"click\", function(){\n      var rows = AFB.quote().filter(function(r){ return BY[r.item]; });\n      var head = [\"Item #\",\"Description\",\"Category\",\"Packaging\",\"Case QTY\",\"Unit Wt (oz)\",\"Cases requested\",\"Est. lb\"];\n      var body = rows.map(function(r){\n        var p = BY[r.item];\n        return [p.item,p.name,p.category,p.format,p.caseQty,p.unitOz,r.cases,(p.caseWeightOz*r.cases/16).toFixed(1)];\n      });\n      var csv = [head].concat(body).map(function(row){\n        return row.map(function(c){ c = String(c);\n          return /[\",\\n]/.test(c) ? '\"'+c.replace(/\"/g,'\"\"')+'\"' : c; }).join(\",\");\n      }).join(\"\\r\\n\");\n      AFB.download(\"afb-quote-request.csv\", csv);\n    });\n\n    var co = document.getElementById(\"checkout\");\n    if (co) co.addEventListener(\"submit\", function(e){\n      e.preventDefault();\n      if (!valid(co)) return;\n      AFB.saveCart([]);\n      done(\"Order received\", \"We've got it. You'll get a confirmation by email, and it leaves Paterson on the next run.\");\n    });\n\n    var qf = document.getElementById(\"quoteform\");\n    if (qf) qf.addEventListener(\"submit\", function(e){\n      e.preventDefault();\n      if (!valid(qf)) return;\n      AFB.saveQuote([]);\n      done(\"Quote request sent\", \"A rep will come back with case pricing and lead times, usually within one business day.\");\n    });\n  }\n\n  function valid(form){\n    var bad = Array.prototype.filter.call(form.querySelectorAll(\"[required]\"), function(i){\n      return !i.value.trim() || (i.type === \"email\" && i.value.indexOf(\"@\") < 1);\n    });\n    var err = form.querySelector(\"#err\");\n    if (bad.length){\n      err.textContent = \"Fill in \" + bad[0].previousElementSibling.textContent.toLowerCase() + \" to continue.\";\n      err.style.color = \"var(--terra-deep)\";\n      bad[0].focus();\n      return false;\n    }\n    err.textContent = \"\";\n    return true;\n  }\n\n  function done(h, p){\n    document.getElementById(\"view\").innerHTML =\n      '<div class=\"empty\" style=\"margin-top:2rem\"><h3>'+h+'</h3><p>'+p+'</p>' +\n      '<a class=\"btn ghost\" href=\"#/shop\">Keep browsing</a></div>';\n    AFB.paintChrome();\n    window.scrollTo(0,0);\n  }\n\n  function esc(s){ return String(s).replace(/[&<>\"]/g, function(c){\n    return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\n})();\n"], "cls": "shell", "style": "padding-block:2rem 1rem"}, "wholesale": {"title": "Wholesale program \u2014 American Food & Beverage", "body": "\n  <section class=\"shell hero\" style=\"padding-block:clamp(2.5rem,6vw,4.5rem) 1.5rem\">\n    <span class=\"eyebrow\">Wholesale &amp; foodservice</span>\n    <h1 style=\"font-size:clamp(2.2rem,5vw,3.6rem);max-width:18ch\">Open an account, get a price sheet, order off the item numbers.</h1>\n    <p class=\"lede\">We supply supermarket chains, independent grocers, distributors, restaurants, hotels and airlines. The process is short on purpose.</p>\n  </section>\n  <section class=\"band\"><div class=\"shell\">\n<div class=\"cols\"><div><h3>1 &middot; Tell us what you buy</h3><p>Send the item numbers you're interested in, or export a list straight off the item sheet. If you're not sure what maps to what, send us your current spec and we'll match it.</p></div><div><h3>2 &middot; We price it against your volume</h3><p>Case pricing depends on how much and how often. Expect a sheet back within one business day, with minimums and lead times per line.</p></div><div><h3>3 &middot; Account setup</h3><p>Credit application, resale certificate, and your delivery windows. Once that's on file pricing shows up when you sign in and you can order by item number.</p></div><div><h3>4 &middot; Standing orders</h3><p>Most accounts settle into a weekly or biweekly cadence. Tell us the day, we'll build the route around it.</p></div></div>\n  </div></section>\n  <section class=\"band tint\"><div class=\"shell narrow\">\n<span class='eyebrow'>The details buyers ask about</span><h2>Minimums, lead times, delivery</h2><dl class='spec' style='grid-template-columns:auto 1fr;font-size:.95rem;margin-top:1.5rem'><dt>Order minimum</dt><dd style='font-family:Karla,sans-serif'>Case quantities per item; a delivery minimum applies by zone and is set at account setup.</dd><dt>Lead time</dt><dd style='font-family:Karla,sans-serif'>Stock items 24&ndash;48 hours. Custom blends and private label run 5&ndash;10 business days on the first order.</dd><dt>Delivery</dt><dd style='font-family:Karla,sans-serif'>Next-day on our own trucks across NJ, NY and CT. Contracted LTL and full truckload nationwide.</dd><dt>Pack changes</dt><dd style='font-family:Karla,sans-serif'>Any item can move between our seven packaging formats. Ask before you assume it isn't available in the size you want.</dd><dt>Shelf life</dt><dd style='font-family:Karla,sans-serif'>Lot-coded with production and best-by dates on every case. Specs and COAs on request.</dd><dt>Samples</dt><dd style='font-family:Karla,sans-serif'>Yes, on qualified accounts. Tell us the items and where to send them.</dd></dl>\n  </div></section>\n  <section class=\"band\"><div class=\"shell narrow\">\n<h2>Ready to price a list?</h2><p>Switch to wholesale mode, work through the item sheet, and send it over. Or just call and read us the numbers.</p><p style='margin-top:1.5rem'><a class='btn' href='#/shop'>Open the item sheet</a><a class='btn ghost' href='#/quote' style='margin-left:.5rem'>Request pricing access</a></p>\n  </div></section>\n\n", "scripts": ["AFB.setMode('wholesale');"], "cls": "", "style": ""}, "private-label": {"title": "Private label & custom packing \u2014 American Food & Beverage", "body": "\n  <section class=\"shell hero\" style=\"padding-block:clamp(2.5rem,6vw,4.5rem) 1.5rem\">\n    <span class=\"eyebrow\">Private label &amp; custom packing</span>\n    <h1 style=\"font-size:clamp(2.2rem,5vw,3.6rem);max-width:18ch\">Your label, your blend, your pack size.</h1>\n    <p class=\"lede\">We already roast, flavor, blend and pack under three of our own brands. Running yours is the same line with a different film.</p>\n  </section>\n  <section class=\"band\"><div class=\"shell\">\n<div class=\"cols\"><div><h3>Custom blends</h3><p>Trail mixes and snack blends built to a formula you approve, scaled by weight percentage so the hundredth case matches the first. Bring a target cost and we'll work backwards to a recipe.</p></div><div><h3>Your packaging</h3><p>Sixteen-ounce clear containers, screw-top jars, to-go cups, presentation trays, granola cups, or bulk cases from 14 to 50 lb. Film, sleeve, label and shrink band to your artwork.</p></div><div><h3>Roasting and flavoring</h3><p>Dry roast, oil roast, honey roast, tamari, cajun, truffle, caramelized. Done here, which is why a flavor tweak is a scheduling question rather than a sourcing project.</p></div><div><h3>Chocolate and yogurt panning</h3><p>Almonds, cashews, peanuts, raisins, cranberries, espresso beans, pretzels &mdash; panned in house to your shell thickness.</p></div></div>\n  </div></section>\n  <section class=\"band tint\"><div class=\"shell narrow\">\n<span class='eyebrow'>What we need from you</span><h2>Starting a private label run</h2><p>Send us three things and we can quote it: the product spec or a sample of what you're matching, your target pack size and case count, and your annual volume estimate. Artwork can come later &mdash; we'll send you the dielines once the format is settled.</p><p>First runs are typically 5&ndash;10 business days after artwork approval. Repeat runs slot into the normal production schedule.</p><p style='margin-top:1.5rem'><a class='btn' href='#/quote'>Start a private label conversation</a></p>\n  </div></section>\n\n", "scripts": [], "cls": "", "style": ""}, "certifications": {"title": "Certifications & food safety \u2014 American Food & Beverage", "body": "\n  <section class=\"shell hero\" style=\"padding-block:clamp(2.5rem,6vw,4.5rem) 1.5rem\">\n    <span class=\"eyebrow\">Certifications &amp; food safety</span>\n    <h1 style=\"font-size:clamp(2.2rem,5vw,3.6rem);max-width:18ch\">The paperwork your QA team is going to ask for.</h1>\n    <p class=\"lede\">We keep certificates current and on hand, because the first thing a new account requests is documentation and the second is a sample.</p>\n  </section>\n  <section class=\"band\"><div class=\"shell\">\n<div class=\"cols\"><div><h3>SQF certified facility</h3><p>Our 60,000 sq ft Paterson plant is certified to the SQF food safety code, with documented prerequisite programs, HACCP plans and internal audits. Certificate and audit score available on request.</p></div><div><h3>USDA Organic</h3><p>Certified organic handler. Organic items run on scheduled lines with documented changeover and segregation, and carry their own item numbers so nothing gets substituted by accident.</p></div><div><h3>OU Kosher</h3><p>Certified by the Orthodox Union across the catalog, with rabbinic supervision on site. The current letter of certification lists every approved item.</p></div><div><h3>Traceability</h3><p>Every case is lot-coded to a production date and a raw material lot. One-up, one-back traceability, exercised in mock recalls, results documented.</p></div><div><h3>Allergen control</h3><p>Peanuts, tree nuts, sesame, milk and soy are all present in the facility. Allergen handling is scheduled and validated; labels state it plainly rather than burying it.</p></div><div><h3>Supplier approval</h3><p>Growers, processors and packers are approved before their first shipment and reviewed on a cycle. COAs held on file per lot.</p></div></div>\n  </div></section>\n  <section class=\"band tint\"><div class=\"shell narrow\">\n<h2>Need the certificates?</h2><p>Ask and we'll send current copies of the SQF certificate, organic certificate, OU letter, insurance, and product specs or COAs for any item number.</p><p style='margin-top:1.5rem'><a class='btn' href='#/contact'>Request documentation</a></p>\n  </div></section>\n\n", "scripts": [], "cls": "", "style": ""}, "about": {"title": "About & facility \u2014 American Food & Beverage", "body": "\n  <section class=\"shell hero\" style=\"padding-block:clamp(2.5rem,6vw,4.5rem) 1.5rem\">\n    <span class=\"eyebrow\">About the company</span>\n    <h1 style=\"font-size:clamp(2.2rem,5vw,3.6rem);max-width:18ch\">Importer, wholesaler, roaster, packer. All four, on one floor.</h1>\n    <p class=\"lede\">American Food &amp; Beverage sources direct from growers, processors and packers worldwide, then finishes and packs everything at our own facility in Paterson, New Jersey.</p>\n  </section>\n  <section class=\"band tint\"><div class=\"shell narrow\">\n<span class='eyebrow'>The floor</span><h2>60,000 square feet in Paterson</h2><p>Receiving, cold and dry storage, roasting, flavoring, chocolate panning, blending, packing and shipping all happen in the same building. That's not a boast about size &mdash; it's why a recipe change or a pack-size change is something we can schedule rather than something we have to source.</p><p>We run three brands out of it: <b>Grassland</b> for organic and natural, <b>Premium Food</b> for the gourmet line, and <b>Tasty</b> for the screw-top jars. Same floor, same standards.</p><div class='stats'><div class='stat'><b>60,000</b><span>Sq ft facility</span></div><div class='stat'><b>370+</b><span>Active SKUs</span></div><div class='stat'><b>10</b><span>Product categories</span></div><div class='stat'><b>Own fleet</b><span>Tri-State next day</span></div></div>\n  </div></section>\n  <section class=\"band\"><div class=\"shell\">\n<div class=\"cols\"><div><h3>What we source</h3><p>Dried fruits, nuts, grains, trail mixes, plantain chips, beans, seeds, peas and lentils, chocolate covered items, gummies and candies &mdash; direct from growers, processors and packers all over the world.</p></div><div><h3>What we also stock</h3><p>Vinegars, honey, olives, sugar, oats, lemon juice and pancake syrups. If it belongs next to our categories on a grocery shelf, ask &mdash; we probably carry it.</p></div><div><h3>Who we serve</h3><p>Corporate supermarkets, independent grocery stores, distributors, restaurants, hotels, airlines and the broader food service industry.</p></div><div><h3>How it ships</h3><p>Our own trucks across the Tri-State area with next-day delivery, plus private trucking partners for deliveries across the rest of the country.</p></div></div>\n  </div></section>\n\n", "scripts": [], "cls": "", "style": ""}, "careers": {"title": "Careers \u2014 American Food &amp; Beverage", "body": "\n\n  <section class=\"hero\" style=\"padding-block:clamp(2.5rem,6vw,4rem) 1rem\">\n    <span class=\"eyebrow\">Careers &middot; Paterson, New Jersey</span>\n    <h1 style=\"font-size:clamp(2.2rem,5vw,3.6rem);max-width:20ch\" data-t=\"h1\">Everything we sell, we pack ourselves.</h1>\n    <p class=\"lede\" data-t=\"lede\">Sixty thousand square feet, our own trucks, and about 370 products that\n    get roasted, blended and packed under this roof. If you'd rather work somewhere that makes\n    something than somewhere that just moves boxes, read on.</p>\n    <div class=\"langbar\">\n      <button class=\"chip\" type=\"button\" data-lang=\"en\" aria-pressed=\"true\">English</button>\n      <button class=\"chip\" type=\"button\" data-lang=\"es\" aria-pressed=\"false\">Espa\u00f1ol</button>\n    </div>\n  </section>\n\n  <section class=\"band\" style=\"border-top:1px solid var(--rule);padding-block:2rem\">\n    <span class=\"eyebrow\" data-t=\"openroles\">Open roles</span>\n    <div class=\"joblist\" id=\"jobs\"></div>\n    <p class=\"count\" style=\"margin-top:1.25rem\" data-t=\"nofit\">Don't see your role? Apply anyway\n    and tell us what you do &mdash; we hire ahead of the posting more often than not.</p>\n  </section>\n\n  <section class=\"band\" id=\"applyPanel\" style=\"border-top:1px solid var(--rule)\">\n    <span class=\"eyebrow\" data-t=\"applyeyebrow\">Application</span>\n    <h2 data-t=\"applyh2\">Two minutes, from your phone</h2>\n    <p style=\"color:var(--ink-soft)\" data-t=\"applysub\">No account, no login. A resume helps but\n    isn't required &mdash; tell us what you've done and we'll follow up.</p>\n\n    <div class=\"panel\" style=\"margin-top:1.25rem\">\n      <form id=\"applyForm\" novalidate>\n        <div class=\"field\">\n          <label for=\"role\" data-t=\"l_role\">Role you're applying for <span class=\"req\">*</span></label>\n          <select id=\"role\" name=\"role\" required></select>\n        </div>\n\n        <div class=\"formgrid\">\n          <div class=\"field\"><label for=\"full_name\" data-t=\"l_name\">Full name <span class=\"req\">*</span></label>\n            <input id=\"full_name\" name=\"full_name\" type=\"text\" autocomplete=\"name\" required></div>\n          <div class=\"field\"><label for=\"phone\" data-t=\"l_phone\">Phone <span class=\"req\">*</span></label>\n            <input id=\"phone\" name=\"phone\" type=\"tel\" inputmode=\"tel\" autocomplete=\"tel\" required></div>\n          <div class=\"field\"><label for=\"email\" data-t=\"l_email\">Email <span class=\"req\">*</span></label>\n            <input id=\"email\" name=\"email\" type=\"email\" inputmode=\"email\" autocomplete=\"email\" required></div>\n          <div class=\"field\"><label for=\"city\" data-t=\"l_city\">Town you live in</label>\n            <input id=\"city\" name=\"city\" type=\"text\" autocomplete=\"address-level2\"></div>\n          <div class=\"field\"><label for=\"earliest_start\" data-t=\"l_start\">Earliest you could start</label>\n            <input id=\"earliest_start\" name=\"earliest_start\" type=\"text\" placeholder=\"Right away, two weeks\u2026\"></div>\n          <div class=\"field\"><label for=\"shift_preference\" data-t=\"l_shift\">Shift preference</label>\n            <select id=\"shift_preference\" name=\"shift_preference\">\n              <option value=\"\">No preference</option>\n              <option>1st shift</option><option>2nd shift</option><option>Either</option>\n            </select></div>\n        </div>\n\n        <div id=\"driverFields\" hidden>\n          <div class=\"formgrid\">\n            <div class=\"field\"><label for=\"cdl_class\" data-t=\"l_cdl\">CDL class</label>\n              <select id=\"cdl_class\" name=\"cdl_class\">\n                <option value=\"\">Select</option><option>Class A</option><option>Class B</option>\n                <option>Class C</option><option>None yet</option>\n              </select></div>\n            <div class=\"field\" style=\"display:flex;align-items:flex-end\">\n              <div class=\"checkrow\" style=\"margin:0\">\n                <input type=\"checkbox\" id=\"clean_license\" name=\"clean_license\">\n                <label for=\"clean_license\" data-t=\"l_clean\">Clean driving record</label>\n              </div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"field\">\n          <label for=\"experience\" data-t=\"l_exp\">What have you done before?</label>\n          <textarea id=\"experience\" name=\"experience\" data-ph=\"ph_exp\"\n            placeholder=\"Where you've worked, what you did, anything you're good at. A few lines is fine.\"></textarea>\n        </div>\n\n        <div class=\"field\">\n          <label for=\"resume\" data-t=\"l_resume\">Resume (optional)</label>\n          <input id=\"resume\" name=\"resume\" type=\"file\"\n                 accept=\".pdf,.doc,.docx,.rtf,.txt,.jpg,.jpeg,.png,.heic\">\n          <div class=\"filehint\" data-t=\"l_resumehint\">PDF, Word, or a photo of a printed resume. Up to 5 MB.</div>\n        </div>\n\n        <div class=\"field\">\n          <label for=\"referred_by\" data-t=\"l_ref\">Did someone here refer you?</label>\n          <input id=\"referred_by\" name=\"referred_by\" type=\"text\" data-ph=\"ph_ref\" placeholder=\"Their name\">\n        </div>\n\n        <div style=\"margin:1.25rem 0\">\n          <div class=\"checkrow\">\n            <input type=\"checkbox\" id=\"authorized_to_work\" name=\"authorized_to_work\" required>\n            <label for=\"authorized_to_work\" data-t=\"l_auth\">I am legally authorized to work in the United States <span class=\"req\">*</span></label>\n          </div>\n          <div class=\"checkrow\">\n            <input type=\"checkbox\" id=\"over_18\" name=\"over_18\" required>\n            <label for=\"over_18\" data-t=\"l_18\">I am 18 or older <span class=\"req\">*</span></label>\n          </div>\n        </div>\n\n        <button class=\"btn\" type=\"submit\" id=\"submitBtn\" data-t=\"l_submit\">Send application</button>\n        <p class=\"count\" style=\"margin-top:.75rem\" id=\"formErr\" role=\"alert\"></p>\n        <p class=\"count\" style=\"margin-top:1rem\" data-t=\"l_privacy\">We use what you send here to\n        consider you for work and nothing else. We don't sell it or share it outside the company.</p>\n      </form>\n    </div>\n  </section>\n\n", "scripts": ["\n(function(){\n  // AFB_API prefixes API CALLS ONLY. Static data files sit next to this page \u2014\n  // prefixing them breaks the moment the site and API are on separate origins.\n  var API = window.AFB_API || \"\";\n  var JOBS = [], META = {}, LANG = \"en\";\n\n  var T = {\n    es: {\n      h1: \"Todo lo que vendemos, lo empacamos nosotros.\",\n      lede: \"Sesenta mil pies cuadrados, nuestros propios camiones y unos 370 productos que se tuestan, mezclan y empacan bajo este techo. Si prefiere trabajar donde se fabrica algo en vez de solo mover cajas, siga leyendo.\",\n      openroles: \"Puestos disponibles\",\n      nofit: \"\u00bfNo ve su puesto? Post\u00falese de todas formas y d\u00edganos qu\u00e9 hace \u2014 muchas veces contratamos antes de publicar.\",\n      applyeyebrow: \"Solicitud\",\n      applyh2: \"Dos minutos, desde su tel\u00e9fono\",\n      applysub: \"Sin cuenta, sin contrase\u00f1a. El curr\u00edculum ayuda pero no es obligatorio \u2014 cu\u00e9ntenos su experiencia y nos comunicaremos.\",\n      l_role: \"Puesto que solicita *\", l_name: \"Nombre completo *\", l_phone: \"Tel\u00e9fono *\",\n      l_email: \"Correo electr\u00f3nico *\", l_city: \"Ciudad donde vive\",\n      l_start: \"\u00bfCu\u00e1ndo podr\u00eda empezar?\", l_shift: \"Turno preferido\",\n      l_cdl: \"Clase de CDL\", l_clean: \"R\u00e9cord de manejo limpio\",\n      l_exp: \"\u00bfQu\u00e9 ha hecho antes?\",\n      ph_exp: \"D\u00f3nde ha trabajado, qu\u00e9 hac\u00eda, en qu\u00e9 es bueno. Unas l\u00edneas bastan.\",\n      l_resume: \"Curr\u00edculum (opcional)\",\n      l_resumehint: \"PDF, Word o una foto de un curr\u00edculum impreso. Hasta 5 MB.\",\n      l_ref: \"\u00bfAlguien de aqu\u00ed lo recomend\u00f3?\", ph_ref: \"Su nombre\",\n      l_auth: \"Tengo autorizaci\u00f3n legal para trabajar en los Estados Unidos *\",\n      l_18: \"Tengo 18 a\u00f1os o m\u00e1s *\",\n      l_submit: \"Enviar solicitud\",\n      l_privacy: \"Usamos esta informaci\u00f3n solo para considerarlo para un empleo. No la vendemos ni la compartimos fuera de la empresa.\",\n      benefits: \"Beneficios\", does: \"Qu\u00e9 har\u00e1\", needs: \"Qu\u00e9 necesita\",\n      sending: \"Enviando\u2026\",\n      ok_h: \"Solicitud recibida\",\n      ok_p: \"Le enviamos una confirmaci\u00f3n por correo. Si su perfil encaja, nos comunicaremos con usted.\",\n      err_required: \"Complete los campos marcados con *\",\n      err_send: \"No se pudo enviar. Intente de nuevo o llame al (908) 345-6345.\"\n    },\n    en: {\n      benefits: \"Benefits\", does: \"What you'll do\", needs: \"What you need\",\n      sending: \"Sending\u2026\",\n      ok_h: \"Application received\",\n      ok_p: \"We've emailed you a confirmation. If it looks like a fit, someone will reach out.\",\n      err_required: \"Fill in the fields marked *\",\n      err_send: \"That didn't send. Try again, or call (908) 345-6345.\"\n    }\n  };\n\n  function t(k, fallback){ return (T[LANG] && T[LANG][k]) || fallback; }\n\n  function money(n, unit){\n    return unit === \"year\"\n      ? \"$\" + n.toLocaleString(\"en-US\") + \"/yr\"\n      : \"$\" + n.toFixed(2) + \"/hr\";\n  }\n\n  (window.AFB_JOBS ? Promise.resolve(window.AFB_JOBS)\n                   : fetch(\"jobs.json\").then(function(r){ return r.json(); })\n  ).then(function(d){\n    JOBS = d.jobs; META = d;\n    renderJobs(); renderRoleOptions();\n    var pre = new URLSearchParams(AFBROUTE.search).get(\"role\");\n    if (pre) { document.getElementById(\"role\").value = pre; toggleDriver(); }\n  }).catch(function(){\n    document.getElementById(\"jobs\").innerHTML =\n      '<div class=\"notice\"><p>Openings couldn\\'t load. Call (908) 345-6345 and ask what\\'s available.</p></div>';\n  });\n\n  function renderJobs(){\n    document.getElementById(\"jobs\").innerHTML = JOBS.map(function(j){\n      return '<article class=\"job\">' +\n        '<div class=\"job-head\"><h3>'+esc(j.title)+'</h3>' +\n          '<span class=\"pay\">'+money(j.payMin,j.payUnit)+' \u2013 '+money(j.payMax,j.payUnit)+'</span></div>' +\n        '<div class=\"tags\">'+esc(j.department)+' &middot; '+esc(j.type)+' &middot; '+esc(j.shift)+'</div>' +\n        '<p class=\"sum\">'+esc(j.summary)+'</p>' +\n        '<details><summary>'+t(\"does\",\"What you\\'ll do\")+' / '+t(\"needs\",\"what you need\")+'</summary>' +\n          '<h4>'+t(\"does\",\"What you\\'ll do\")+'</h4><ul>' +\n          j.does.map(function(x){ return \"<li>\"+esc(x)+\"</li>\"; }).join(\"\") + '</ul>' +\n          '<h4>'+t(\"needs\",\"What you need\")+'</h4><ul>' +\n          j.needs.map(function(x){ return \"<li>\"+esc(x)+\"</li>\"; }).join(\"\") + '</ul>' +\n          '<h4>'+t(\"benefits\",\"Benefits\")+'</h4>' +\n          '<ul><li>'+esc(META.benefits||\"\")+'</li>' +\n          '<li>'+esc(j.extraComp || META.otherCompensation || \"\")+'</li></ul>' +\n        '</details>' +\n        '<button class=\"btn small\" type=\"button\" data-apply=\"'+j.title+'\" data-id=\"'+j.id+'\">Apply</button>' +\n      '</article>';\n    }).join(\"\");\n  }\n\n  function renderRoleOptions(){\n    document.getElementById(\"role\").innerHTML =\n      JOBS.map(function(j){ return '<option value=\"'+esc(j.title)+'\">'+esc(j.title)+'</option>'; }).join(\"\") +\n      '<option value=\"General application\">General application \u2014 tell us what you do</option>';\n  }\n\n  function toggleDriver(){\n    var v = document.getElementById(\"role\").value.toLowerCase();\n    document.getElementById(\"driverFields\").hidden = v.indexOf(\"driver\") < 0;\n  }\n\n  AFBNAV.on(\"click\", function(e){\n    var b = e.target.closest(\"[data-apply]\");\n    if (b){\n      document.getElementById(\"role\").value = b.dataset.apply;\n      toggleDriver();\n      document.getElementById(\"applyPanel\").scrollIntoView({behavior:\"smooth\"});\n      setTimeout(function(){ document.getElementById(\"full_name\").focus(); }, 400);\n    }\n    var l = e.target.closest(\"[data-lang]\");\n    if (l){ setLang(l.dataset.lang); }\n  });\n\n  document.getElementById(\"role\").addEventListener(\"change\", toggleDriver);\n\n  function setLang(lang){\n    LANG = lang;\n    document.documentElement.lang = lang;\n    document.querySelectorAll(\"[data-lang]\").forEach(function(b){\n      b.setAttribute(\"aria-pressed\", String(b.dataset.lang === lang));\n    });\n    document.querySelectorAll(\"[data-t]\").forEach(function(el){\n      var v = T[lang] && T[lang][el.dataset.t];\n      if (v) { el.textContent = v; el.innerHTML = v.replace(/\\*/g, '<span class=\"req\">*</span>'); }\n    });\n    document.querySelectorAll(\"[data-ph]\").forEach(function(el){\n      var v = T[lang] && T[lang][el.dataset.ph];\n      if (v) el.placeholder = v;\n    });\n    if (lang === \"en\") location.reload();\n    else renderJobs();\n  }\n\n  document.getElementById(\"applyForm\").addEventListener(\"submit\", function(e){\n    e.preventDefault();\n    var form = this, err = document.getElementById(\"formErr\"), btn = document.getElementById(\"submitBtn\");\n\n    var missing = Array.prototype.filter.call(form.querySelectorAll(\"[required]\"), function(i){\n      return i.type === \"checkbox\" ? !i.checked : !i.value.trim();\n    });\n    if (missing.length){\n      err.style.color = \"var(--terra-deep)\";\n      err.textContent = t(\"err_required\", \"Fill in the fields marked *\");\n      missing[0].focus();\n      return;\n    }\n\n    var fd = new FormData();\n    [\"role\",\"full_name\",\"email\",\"phone\",\"city\",\"earliest_start\",\"shift_preference\",\n     \"cdl_class\",\"experience\",\"referred_by\"].forEach(function(k){\n      var el = document.getElementById(k);\n      fd.append(k, el ? el.value : \"\");\n    });\n    fd.append(\"authorized_to_work\", document.getElementById(\"authorized_to_work\").checked);\n    fd.append(\"over_18\", document.getElementById(\"over_18\").checked);\n    fd.append(\"clean_license\", document.getElementById(\"clean_license\").checked);\n    fd.append(\"language\", LANG);\n    var f = document.getElementById(\"resume\").files[0];\n    if (f) fd.append(\"resume\", f);\n\n    btn.disabled = true; btn.textContent = t(\"sending\",\"Sending\u2026\"); err.textContent = \"\";\n\n    (window.AFB_DEMO\n      ? new Promise(function(res){ setTimeout(function(){ res({ ok:true, json:function(){ return Promise.resolve({ok:true}); } }); }, 600); })\n      : fetch(API + \"/api/applications\", { method: \"POST\", body: fd })\n    )\n      .then(function(r){ if (!r.ok) return r.json().then(function(j){ throw new Error(j.detail || r.status); }); return r.json(); })\n      .then(function(){\n        form.parentElement.innerHTML =\n          '<h3 style=\"margin-bottom:.4em\">'+t(\"ok_h\",\"Application received\")+'</h3>' +\n          '<p>'+t(\"ok_p\",\"We\\'ve emailed you a confirmation. If it looks like a fit, someone will reach out.\")+'</p>';\n        window.scrollTo({ top: document.getElementById(\"applyPanel\").offsetTop - 80, behavior: \"smooth\" });\n      })\n      .catch(function(ex){\n        btn.disabled = false; btn.textContent = t(\"l_submit\",\"Send application\");\n        err.style.color = \"var(--terra-deep)\";\n        err.textContent = (ex.message && ex.message.length < 120 ? ex.message + \" \" : \"\") +\n                          t(\"err_send\",\"That didn't send. Try again, or call (908) 345-6345.\");\n      });\n  });\n\n  function esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){\n    return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\n})();\n"], "cls": "shell", "style": ""}, "sops": {"title": "SOP library \u2014 American Food &amp; Beverage", "body": "\n\n  <span class=\"eyebrow\">Operations portal &middot; controlled documents</span>\n  <h1 style=\"font-size:clamp(2rem,4vw,3rem)\">SOP library</h1>\n  <p style=\"color:var(--ink-soft);max-width:62ch\">The current version of every procedure.\n  If you printed one, the copy in your hand is out of date the moment this page changes &mdash;\n  work from the screen.</p>\n\n  <div class=\"whoami\">\n    <div>\n      <label for=\"who\">Your name</label>\n      <input id=\"who\" type=\"text\" placeholder=\"As it should appear on the record\">\n    </div>\n    <div>\n      <label for=\"role\">Your role</label>\n      <select id=\"role\"><option value=\"\">All roles</option></select>\n    </div>\n    <div style=\"flex:0 0 auto\">\n      <button class=\"chip\" type=\"button\" id=\"sqfOnly\" aria-pressed=\"false\">Food safety only</button>\n    </div>\n  </div>\n\n  <p class=\"count\" id=\"summary\">Loading the library&hellip;</p>\n  <div class=\"doclist\" id=\"docs\"></div>\n\n", "scripts": ["\n(function(){\n  // AFB_API prefixes API CALLS ONLY. Static data files sit next to this page \u2014\n  // prefixing them breaks the moment the site and API are on separate origins.\n  var API = window.AFB_API || \"\";\n  var DOCS = [], ACKED = {}, state = { role:\"\", sqfOnly:false };\n\n  (window.AFB_SOPS ? Promise.resolve(window.AFB_SOPS)\n                   : fetch(\"sops.json\").then(function(r){ return r.json(); })\n  ).then(function(d){\n    DOCS = d.documents;\n    var roles = {};\n    DOCS.forEach(function(x){ (x.roles||[]).forEach(function(r){ roles[r] = 1; }); });\n    document.getElementById(\"role\").innerHTML = '<option value=\"\">All roles</option>' +\n      Object.keys(roles).sort().map(function(r){ return '<option>'+esc(r)+'</option>'; }).join(\"\");\n    render();\n  }).catch(function(){\n    document.getElementById(\"summary\").textContent =\n      \"The library didn't load. Check that sops.json is being served.\";\n  });\n\n  document.getElementById(\"role\").addEventListener(\"change\", function(){\n    state.role = this.value; render();\n  });\n  document.getElementById(\"sqfOnly\").addEventListener(\"click\", function(){\n    state.sqfOnly = !state.sqfOnly;\n    this.setAttribute(\"aria-pressed\", String(state.sqfOnly));\n    render();\n  });\n\n  function visible(){\n    return DOCS.filter(function(d){\n      if (state.sqfOnly && d.scope !== \"sqf\") return false;\n      if (state.role && (d.roles||[]).indexOf(state.role) < 0) return false;\n      return true;\n    });\n  }\n\n  function gaps(d){\n    var g = [];\n    if (!d.owner) g.push(\"owner\");\n    if (!d.approver) g.push(\"approver\");\n    if (!d.version) g.push(\"version\");\n    if (!d.effectiveDate) g.push(\"effective date\");\n    return g;\n  }\n\n  function render(){\n    var rows = visible();\n    var outstanding = rows.filter(function(d){\n      return d.status === \"active\" && !ACKED[d.code + \"@\" + d.version];\n    }).length;\n    document.getElementById(\"summary\").textContent =\n      rows.length + \" document\" + (rows.length === 1 ? \"\" : \"s\") +\n      (state.role ? \" for \" + state.role : \"\") +\n      \" \u00b7 \" + outstanding + \" awaiting your acknowledgement\";\n\n    document.getElementById(\"docs\").innerHTML = rows.map(function(d){\n      var g = gaps(d), key = d.code + \"@\" + d.version, done = ACKED[key];\n      return '<article class=\"doc' + (d.scope === \"sqf\" ? \" sqf\" : \"\") + '\">' +\n        '<div class=\"doc-head\"><code class=\"code\">' + esc(d.code) + '</code>' +\n          '<h3>' + esc(d.title) + '</h3></div>' +\n        '<div class=\"meta\">' + esc(d.department || \"\") +\n          ' &middot; v' + esc(d.version || \"\u2014\") +\n          ' &middot; ' + esc((d.roles||[]).join(\", \")) + '</div>' +\n        (d.scope === \"sqf\" ? '<span class=\"pill sqf\">Food safety</span>' : '') +\n        (d.status === \"draft\" ? '<span class=\"pill draft\">Draft \u2014 not issued</span>' : '') +\n        (d.confidential ? '<span class=\"pill draft\">Confidential</span>' : '') +\n        (g.length ? '<span class=\"pill gap\">Needs ' + esc(g.join(\", \")) + '</span>' : '') +\n        (done ? '<span class=\"pill done\">Acknowledged</span>' : '') +\n        '<details><summary style=\"cursor:pointer;font-family:\\'IBM Plex Mono\\',monospace;' +\n          'font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);' +\n          'margin-top:.8rem\">Read the procedure</summary>' +\n          '<div class=\"body\">' + md(d.body || \"\") + '</div>' +\n          (d.status === \"draft\"\n            ? '<p class=\"count\" style=\"margin-top:.8rem\">This document is in draft and cannot be acknowledged yet.</p>'\n            : !d.version\n              ? '<p class=\"count\" style=\"margin-top:.8rem\">No version number assigned \u2014 acknowledgement would prove nothing.</p>'\n              : '<button class=\"btn small\" type=\"button\" style=\"margin-top:.9rem\" ' +\n                'data-ack=\"' + esc(d.code) + '\"' + (done ? ' disabled' : '') + '>' +\n                (done ? 'Acknowledged' : 'I have read and understood v' + esc(d.version)) + '</button>') +\n        '</details>' +\n      '</article>';\n    }).join(\"\");\n  }\n\n  AFBNAV.on(\"click\", function(e){\n    var b = e.target.closest(\"[data-ack]\");\n    if (!b) return;\n    var who = document.getElementById(\"who\").value.trim();\n    if (!who){\n      document.getElementById(\"who\").focus();\n      document.getElementById(\"summary\").textContent = \"Enter your name before acknowledging.\";\n      return;\n    }\n    var code = b.dataset.ack;\n    var d = DOCS.filter(function(x){ return x.code === code; })[0];\n    b.disabled = true; b.textContent = \"Recording\u2026\";\n\n    var done = function(){\n      ACKED[code + \"@\" + d.version] = true;\n      render();\n    };\n    if (window.AFB_DEMO){ setTimeout(done, 500); return; }\n    fetch(API + \"/api/sops/\" + encodeURIComponent(code) + \"/acknowledge\", {\n      method: \"POST\", headers: {\"Content-Type\":\"application/json\"},\n      body: JSON.stringify({ person: who, person_role: document.getElementById(\"role\").value || null })\n    }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })\n      .then(done)\n      .catch(function(){\n        b.disabled = false;\n        b.textContent = \"Couldn't record \u2014 try again\";\n      });\n  });\n\n  // deliberately small markdown subset: headings, tables, lists, quotes, bold, code\n  function md(src){\n    var lines = esc(src).replace(/<!--[\\s\\S]*?-->/g, \"\").split(\"\\n\");\n    var out = [], inTable = false, inList = null;\n    function closeList(){ if (inList){ out.push(\"</\" + inList + \">\"); inList = null; } }\n    function closeTable(){ if (inTable){ out.push(\"</table>\"); inTable = false; } }\n    lines.forEach(function(ln){\n      var t = ln.trim();\n      if (/^\\|/.test(t)){\n        if (/^\\|[\\s\\-|:]+\\|$/.test(t)) return;\n        closeList();\n        var cells = t.split(\"|\").slice(1, -1);\n        var tag = inTable ? \"td\" : \"th\";\n        if (!inTable){ out.push(\"<table>\"); inTable = true; }\n        out.push(\"<tr>\" + cells.map(function(c){\n          return \"<\" + tag + \">\" + inline(c.trim()) + \"</\" + tag + \">\"; }).join(\"\") + \"</tr>\");\n        return;\n      }\n      closeTable();\n      var h = /^(#{2,4})\\s+(.*)$/.exec(t);\n      if (h){ closeList(); out.push(\"<h\" + h[1].length + \">\" + inline(h[2]) + \"</h\" + h[1].length + \">\"); return; }\n      if (/^>\\s?/.test(t)){ closeList(); out.push(\"<blockquote>\" + inline(t.replace(/^>\\s?/, \"\")) + \"</blockquote>\"); return; }\n      var li = /^(-|\\d+\\.)\\s+(.*)$/.exec(t);\n      if (li){\n        var want = li[1] === \"-\" ? \"ul\" : \"ol\";\n        if (inList !== want){ closeList(); out.push(\"<\" + want + \">\"); inList = want; }\n        out.push(\"<li>\" + inline(li[2]) + \"</li>\");\n        return;\n      }\n      closeList();\n      if (t === \"\" || t === \"---\") return;\n      out.push(\"<p>\" + inline(t) + \"</p>\");\n    });\n    closeList(); closeTable();\n    return out.join(\"\");\n  }\n  function inline(s){\n    return s.replace(/\\*\\*(.+?)\\*\\*/g, \"<strong>$1</strong>\")\n            .replace(/`(.+?)`/g, \"<code>$1</code>\")\n            .replace(/\\*(.+?)\\*/g, \"<em>$1</em>\");\n  }\n  function esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){\n    return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\n})();\n"], "cls": "shell", "style": "padding-block:2rem"}, "quote": {"title": "Request wholesale pricing \u2014 American Food & Beverage", "body": "\n  <section class=\"shell hero\" style=\"padding-block:clamp(2.5rem,6vw,4.5rem) 1.5rem\">\n    <span class=\"eyebrow\">Request pricing access</span>\n    <h1 style=\"font-size:clamp(2.2rem,5vw,3.6rem);max-width:18ch\">Tell us what you buy and we'll send a price sheet.</h1>\n    <p class=\"lede\">Wholesale pricing is set per account, so it lives behind a short form rather than on a public page. This usually comes back the same day.</p>\n  </section>\n  <section class=\"band\"><div class=\"shell\" style=\"max-width:760px\">\n    <div class=\"panel\">\n      <form id=\"access\" novalidate>\n        <div class=\"formgrid\">\n          <div class=\"field\"><label for=\"company\">Company</label><input id=\"company\" type=\"text\" required></div>\n          <div class=\"field\"><label for=\"name\">Contact name</label><input id=\"name\" type=\"text\" required></div>\n          <div class=\"field\"><label for=\"email\">Work email</label><input id=\"email\" type=\"email\" required></div>\n          <div class=\"field\"><label for=\"phone\">Phone</label><input id=\"phone\" type=\"tel\" required></div>\n          <div class=\"field\"><label for=\"type\">Business type</label>\n            <select id=\"type\">\n              <option>Supermarket chain</option><option>Independent grocer</option>\n              <option>Distributor</option><option>Restaurant / foodservice</option>\n              <option>Hotel</option><option>Airline</option><option>Other</option>\n            </select></div>\n          <div class=\"field\"><label for=\"volume\">Monthly volume, roughly</label>\n            <select id=\"volume\">\n              <option>Under 20 cases</option><option>20&ndash;100 cases</option>\n              <option>100&ndash;500 cases</option><option>Pallet quantities</option>\n              <option>Truckload</option><option>Not sure yet</option>\n            </select></div>\n          <div class=\"field full\"><label for=\"cats\">Categories you're interested in</label>\n            <input id=\"cats\" type=\"text\" placeholder=\"Nuts, trail mixes, organic dried fruit&hellip;\"></div>\n          <div class=\"field full\"><label for=\"notes\">Anything else</label>\n            <textarea id=\"notes\" placeholder=\"Private label, specific item numbers, delivery windows, target price points\"></textarea></div>\n        </div>\n        <button class=\"btn\" type=\"submit\">Request access</button>\n        <p class=\"count\" style=\"margin-top:.75rem\" id=\"err\" role=\"alert\"></p>\n      </form>\n    </div>\n    <p class=\"count\" style=\"margin-top:1.25rem\">Prefer to talk? Call <a href=\"tel:+19083456345\">(908)&nbsp;345-6345</a>\n    or email <a href=\"mailto:sales@americanfoodbeverage.com\">sales@americanfoodbeverage.com</a>.</p>\n  </div></section>\n\n", "scripts": ["\ndocument.getElementById(\"access\").addEventListener(\"submit\", function(e){\n  e.preventDefault();\n  var form = this, err = document.getElementById(\"err\");\n  var bad = Array.prototype.filter.call(form.querySelectorAll(\"[required]\"), function(i){\n    return !i.value.trim() || (i.type === \"email\" && i.value.indexOf(\"@\") < 1);\n  });\n  if (bad.length){\n    err.style.color = \"var(--terra-deep)\";\n    err.textContent = \"Fill in \" + bad[0].previousElementSibling.textContent.toLowerCase() + \" to continue.\";\n    bad[0].focus(); return;\n  }\n  form.parentElement.innerHTML =\n    '<h3 style=\"margin-bottom:.4em\">Request received</h3>' +\n    '<p>A rep will be in touch, usually the same business day. If it\\'s urgent, call (908) 345-6345.</p>' +\n    '<a class=\"btn ghost\" href=\"#/shop\">Browse the item sheet</a>';\n  window.scrollTo(0,0);\n});\n"], "cls": "", "style": ""}, "contact": {"title": "Contact \u2014 American Food & Beverage", "body": "\n  <section class=\"shell hero\" style=\"padding-block:clamp(2.5rem,6vw,4.5rem) 1.5rem\">\n    <span class=\"eyebrow\">Contact</span>\n    <h1 style=\"font-size:clamp(2.2rem,5vw,3.6rem);max-width:18ch\">Paterson, New Jersey. Someone picks up.</h1>\n    <p class=\"lede\">Sales, orders, certificates, samples, or a question about an item number &mdash; here's where each goes.</p>\n  </section>\n  <section class=\"band\"><div class=\"shell\">\n<div class=\"cols\"><div><h3>Sales &amp; new accounts</h3><p><a href='mailto:sales@americanfoodbeverage.com'>sales@americanfoodbeverage.com</a><br><a href='tel:+19083456345'>(908) 345-6345</a></p></div><div><h3>Orders</h3><p><a href='mailto:orders@grasslandfoods.com'>orders@grasslandfoods.com</a><br>Existing accounts, reorders and delivery changes.</p></div><div><h3>Mail</h3><p>PO Box 533<br>Paterson, NJ 07543<br>United States</p></div><div><h3>Documentation</h3><p>SQF and organic certificates, OU letters, specs and COAs &mdash; ask sales and we'll send current copies.</p></div></div>\n  </div></section>\n  <section class=\"band tint\"><div class=\"shell\" style=\"max-width:760px\">\n    <span class=\"eyebrow\">Send a message</span>\n    <h2>What do you need?</h2>\n    <div class=\"panel\" style=\"margin-top:1.25rem\">\n      <form id=\"contact\" novalidate>\n        <div class=\"formgrid\">\n          <div class=\"field\"><label for=\"name\">Your name</label><input id=\"name\" type=\"text\" required></div>\n          <div class=\"field\"><label for=\"email\">Email</label><input id=\"email\" type=\"email\" required></div>\n          <div class=\"field\"><label for=\"company\">Company (optional)</label><input id=\"company\" type=\"text\"></div>\n          <div class=\"field\"><label for=\"topic\">Topic</label>\n            <select id=\"topic\">\n              <option>New wholesale account</option><option>Existing order</option>\n              <option>Private label</option><option>Certificates &amp; documentation</option>\n              <option>Samples</option><option>Something else</option>\n            </select></div>\n          <div class=\"field full\"><label for=\"msg\">Message</label>\n            <textarea id=\"msg\" required placeholder=\"Item numbers help if you have them\"></textarea></div>\n        </div>\n        <button class=\"btn\" type=\"submit\">Send message</button>\n        <p class=\"count\" style=\"margin-top:.75rem\" id=\"err\" role=\"alert\"></p>\n      </form>\n    </div>\n  </div></section>\n\n", "scripts": ["\ndocument.getElementById(\"contact\").addEventListener(\"submit\", function(e){\n  e.preventDefault();\n  var form = this, err = document.getElementById(\"err\");\n  var bad = Array.prototype.filter.call(form.querySelectorAll(\"[required]\"), function(i){\n    return !i.value.trim() || (i.type === \"email\" && i.value.indexOf(\"@\") < 1);\n  });\n  if (bad.length){\n    err.style.color = \"var(--terra-deep)\";\n    err.textContent = \"Fill in \" + bad[0].previousElementSibling.textContent.toLowerCase() + \" to continue.\";\n    bad[0].focus(); return;\n  }\n  form.parentElement.innerHTML =\n    '<h3 style=\"margin-bottom:.4em\">Message sent</h3>' +\n    '<p>Thanks &mdash; we\\'ll get back to you shortly. For anything time-sensitive, call (908) 345-6345.</p>';\n});\n"], "cls": "", "style": ""}};
var AFBROUTE = { name: "index", search: "" };

var AFBNAV = (function () {
  var ctrl = null;
  return {
    reset: function () { if (ctrl) ctrl.abort(); ctrl = new AbortController(); },
    on: function (type, fn) {
      try { document.addEventListener(type, fn, { signal: ctrl.signal }); }
      catch (e) { document.addEventListener(type, fn); }
    }
  };
})();

function parseHash() {
  var h = location.hash.replace(/^#\/?/, "") || "index";
  var i = h.indexOf("?");
  var name = i < 0 ? h : h.slice(0, i);
  var search = i < 0 ? "" : h.slice(i);
  if (!ROUTES[name]) { name = "index"; search = ""; }
  return { name: name, search: search };
}

function go() {
  AFBROUTE = parseHash();
  var r = ROUTES[AFBROUTE.name];
  AFBNAV.reset();

  document.title = r.title;

  // a fresh <main> drops every listener the previous page attached to it
  var old = document.getElementById("main");
  var fresh = document.createElement("main");
  fresh.id = "main";
  if (r.cls) fresh.className = r.cls;
  if (r.style) fresh.setAttribute("style", r.style);
  fresh.innerHTML = r.body;
  old.parentNode.replaceChild(fresh, old);

  AFB.renderChrome();

  r.scripts.forEach(function (src) {
    try { (0, eval)(src); }
    catch (e) { console.error("route script failed:", AFBROUTE.name, e); }
  });

  window.scrollTo(0, 0);
}

// intercept in-document links so the back button still works
document.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a) return;
  if (a.getAttribute("href") === location.hash) { e.preventDefault(); go(); }
});

window.addEventListener("hashchange", go);

</script>
<script>
/* =========================================================================
   American Food & Beverage — shared behaviour
   Loads the catalog, remembers the visitor's mode, runs both carts.
   ========================================================================= */
(function () {
  "use strict";

  /* ---------- storage (falls back to memory when blocked) ------------- */
  var mem = {};
  var store = {
    get: function (k) {
      try { var v = localStorage.getItem(k); return v === null ? mem[k] : v; }
      catch (e) { return mem[k]; }
    },
    set: function (k, v) {
      mem[k] = v;
      try { localStorage.setItem(k, v); } catch (e) { /* memory only */ }
    }
  };
  var getJSON = function (k, d) { try { return JSON.parse(store.get(k)) || d; } catch (e) { return d; } };
  var setJSON = function (k, v) { store.set(k, JSON.stringify(v)); };

  /* ---------- mode ---------------------------------------------------- */
  var MODE_KEY = "afb.mode";
  function getMode() { return store.get(MODE_KEY) === "wholesale" ? "wholesale" : "retail"; }
  function setMode(m) {
    store.set(MODE_KEY, m);
    document.documentElement.dataset.mode = m;
    document.dispatchEvent(new CustomEvent("afb:mode", { detail: m }));
    paintChrome();
  }

  /* ---------- carts --------------------------------------------------- */
  // retail cart: [{item, qty}] priced; quote list: [{item, cases}] unpriced
  function cart() { return getJSON("afb.cart", []); }
  function quote() { return getJSON("afb.quote", []); }
  function saveCart(c) { setJSON("afb.cart", c); paintChrome(); }
  function saveQuote(q) { setJSON("afb.quote", q); paintChrome(); }

  function addToCart(item, qty) {
    var c = cart(), row = c.filter(function (r) { return r.item === item; })[0];
    if (row) { row.qty += qty; } else { c.push({ item: item, qty: qty }); }
    saveCart(c);
  }
  function addToQuote(item, cases) {
    var q = quote(), row = q.filter(function (r) { return r.item === item; })[0];
    if (row) { row.cases += cases; } else { q.push({ item: item, cases: cases }); }
    saveQuote(q);
  }
  function cartCount() { return cart().reduce(function (n, r) { return n + r.qty; }, 0); }
  function quoteCount() { return quote().length; }

  /* ---------- catalog -------------------------------------------------- */
  var MIN = null;
  function minimums() { return MIN; }

  var catalogPromise = null;
  function catalog() {
    if (catalogPromise) return catalogPromise;
    MIN = window.AFB_CATALOG.minimums;
    catalogPromise = Promise.resolve(window.AFB_CATALOG);
    return catalogPromise;
  }
  function base() {
    // every page sits at the site root, so this is a no-op hook for subfolders
    return "";
  }

  /* ---------- fuzzy-ish search ----------------------------------------- */
  function matches(p, q) {
    if (!q) return true;
    var hay = (p.item + " " + p.name + " " + p.category + " " + p.format).toLowerCase();
    return q.toLowerCase().split(/\s+/).every(function (tok) {
      if (!tok) return true;
      if (hay.indexOf(tok) > -1) return true;
      // loose subsequence match, so "almrst" still finds Almonds Roasted
      var i = 0;
      for (var c = 0; c < hay.length && i < tok.length; c++) if (hay[c] === tok[i]) i++;
      return i === tok.length && tok.length > 3;
    });
  }

  /* ---------- formatting ----------------------------------------------- */
  function money(n) { return "$" + n.toFixed(2); }
  function oz(n) { return (Math.round(n * 100) / 100) + " oz"; }
  function glyph(cat) {
    return ({
      "Nuts": "N", "Flavored Gourmet Nuts": "G", "Seeds": "S", "Trail Mixes": "T",
      "Dried Fruits": "F", "Granolas & Crunches": "R", "Plantain Chips": "P",
      "Chocolate Covered": "C", "Candy & Gummies": "Y", "Grains, Beans & Lentils": "B"
    })[cat] || "•";
  }

  /* ---------- chrome (header + footer) ---------------------------------- */
  var NAV = [
    ["#/shop", "Shop"],
    ["#/wholesale", "Wholesale"],
    ["#/private-label", "Private label"],
    ["#/certifications", "Food safety"],
    ["#/about", "About"],
    ["#/careers", "Careers"],
    ["#/sops", "SOPs"],
    ["#/contact", "Contact"]
  ];

  function renderChrome() {
    var here = location.pathname.split("/").pop() || "#/index";
    var head = document.querySelector("[data-masthead]");
    if (head) {
      head.className = "masthead";
      head.innerHTML =
        '<div class="shell masthead-in">' +
        '<a class="brand" href="#/index"><b>American Food &amp; Beverage</b>' +
        '<span>Grassland &middot; Premium Food</span></a>' +
        '<nav class="nav" aria-label="Main">' +
        NAV.map(function (n) {
          return '<a href="' + n[0] + '"' + (n[0] === here ? ' aria-current="page"' : '') + '>' + n[1] + '</a>';
        }).join("") +
        '<span class="stamp" role="group" aria-label="Browsing mode">' +
        '<button type="button" data-set-mode="retail">Retail</button>' +
        '<button type="button" data-set-mode="wholesale">Wholesale</button>' +
        '</span>' +
        '<a class="cartlink" href="#/cart" data-cartlink></a>' +
        '</nav></div>';
      head.addEventListener("click", function (e) {
        var b = e.target.closest("[data-set-mode]");
        if (b) setMode(b.dataset.setMode);
      });
    }

    var foot = document.querySelector("[data-footer]");
    if (foot) {
      foot.className = "foot";
      foot.innerHTML =
        '<div class="shell"><div class="foot-grid">' +
        '<div><h4>American Food &amp; Beverage</h4>' +
        '<p style="font-size:.9rem;color:var(--ink-soft)">Importer, wholesaler, roaster and packer. ' +
        '60,000 sq ft in Paterson, New Jersey, with our own fleet and next-day delivery across the Tri-State area.</p>' +
        '<div class="certs"><span>SQF Certified</span><span>USDA Organic</span><span>OU Kosher</span></div></div>' +
        '<div><h4>Shop</h4><ul>' +
        '<li><a href="#/shop">Full catalog</a></li>' +
        '<li><a href="#/shop?cat=Nuts">Nuts</a></li>' +
        '<li><a href="#/shop?cat=Dried%20Fruits">Dried fruits</a></li>' +
        '<li><a href="#/shop?cat=Trail%20Mixes">Trail mixes</a></li>' +
        '<li><a href="#/shop?organic=1">Organic items</a></li></ul></div>' +
        '<div><h4>Buyers</h4><ul>' +
        '<li><a href="#/wholesale">Wholesale program</a></li>' +
        '<li><a href="#/private-label">Private label</a></li>' +
        '<li><a href="#/certifications">Certifications</a></li>' +
        '<li><a href="#/quote">Request pricing</a></li>' +
        '<li><a href="#/careers">Careers &amp; jobs</a></li></ul></div>' +
        '<div><h4>Reach us</h4><ul>' +
        '<li>PO Box 533<br>Paterson, NJ 07543</li>' +
        '<li><a href="tel:+19083456345">(908) 345-6345</a></li>' +
        '<li><a href="mailto:sales@americanfoodbeverage.com">sales@americanfoodbeverage.com</a></li>' +
        '<li><a href="mailto:orders@grasslandfoods.com">orders@grasslandfoods.com</a></li></ul></div>' +
        '</div><div class="legal">American Food &amp; Beverage &middot; Premium Food Distributors, DBA Grassland &middot; ' +
        'Prices and availability subject to change.</div></div>';
    }
    paintChrome();
  }

  function paintChrome() {
    var m = getMode();
    document.documentElement.dataset.mode = m;
    document.querySelectorAll("[data-set-mode]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.setMode === m));
    });
    document.querySelectorAll("[data-cartlink]").forEach(function (a) {
      if (m === "wholesale") {
        var n = quoteCount();
        a.innerHTML = "Quote <b>" + n + "</b>";
        a.setAttribute("aria-label", n + " items on your quote request");
      } else {
        var c = cartCount();
        a.innerHTML = "Cart <b>" + c + "</b>";
        a.setAttribute("aria-label", c + " items in your cart");
      }
    });
  }

  /* ---------- minimum order checks ------------------------------------- */
  // Retail gates on subtotal. Wholesale can't gate on money (pricing is
  // account-specific), so it gates on cases or weight — whichever lands first.
  function retailCheck(subtotal) {
    var m = MIN.retail, ok = subtotal >= m.orderSubtotal;
    return {
      ok: ok,
      short: Math.max(0, m.orderSubtotal - subtotal),
      pct: Math.min(100, (subtotal / m.orderSubtotal) * 100),
      message: ok ? "" : "Add " + money(m.orderSubtotal - subtotal) +
        " to reach the " + money(m.orderSubtotal) + " order minimum."
    };
  }

  function shipping(subtotal) {
    var m = MIN.retail;
    return subtotal >= m.freeShippingAt ? 0 : m.shippingFlat;
  }

  function wholesaleCheck(cases, lb) {
    var m = MIN.wholesale;
    var byCase = cases >= m.orderCases, byWeight = lb >= m.orderWeightLb;
    var ok = m.rule === "both" ? (byCase && byWeight) : (byCase || byWeight);
    return {
      ok: ok, byCase: byCase, byWeight: byWeight,
      shortCases: Math.max(0, m.orderCases - cases),
      shortLb: Math.max(0, m.orderWeightLb - lb),
      pct: Math.min(100, Math.max(cases / m.orderCases, lb / m.orderWeightLb) * 100),
      message: ok ? "" : "Opening order minimum is " + m.orderCases + " cases or " +
        m.orderWeightLb + " lb. You're " + Math.max(0, m.orderCases - cases) +
        " cases short — or add " + Math.ceil(Math.max(0, m.orderWeightLb - lb)) + " lb."
    };
  }

  // a line below its own MOQ
  function lineShort(product, cases) { return Math.max(0, product.moq - cases); }

  /* ---------- CSV export ------------------------------------------------ */
  function toCSV(rows) {
    var head = ["Item #", "Description", "Category", "Packaging", "Case QTY", "Unit Wt (oz)", "Case Wt (oz)", "Min cases", "Organic"];
    var body = rows.map(function (p) {
      return [p.item, p.name, p.category, p.format, p.caseQty, p.unitOz, p.caseWeightOz, p.moq, p.organic ? "Yes" : ""];
    });
    return [head].concat(body).map(function (r) {
      return r.map(function (c) {
        c = String(c);
        return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
      }).join(",");
    }).join("\r\n");
  }
  function download(name, text) {
    var b = new Blob([text], { type: "text/csv;charset=utf-8" });
    var u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 500);
  }

  /* ---------- expose ----------------------------------------------------- */
  window.AFB = {
    getMode: getMode, setMode: setMode, catalog: catalog, matches: matches,
    money: money, oz: oz, glyph: glyph,
    cart: cart, quote: quote, saveCart: saveCart, saveQuote: saveQuote,
    addToCart: addToCart, addToQuote: addToQuote, paintChrome: paintChrome,
    toCSV: toCSV, download: download, renderChrome: renderChrome,
    minimums: minimums, retailCheck: retailCheck, wholesaleCheck: wholesaleCheck,
    shipping: shipping, lineShort: lineShort
  };

  window.AFB_renderChrome = renderChrome;
})();

</script>
