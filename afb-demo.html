<!DOCTYPE html>
<html lang="en" data-mode="retail">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EDE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AFB">
<title>American Food &amp; Beverage</title>
<meta name="description" content="Wholesale importer, roaster and packer of dried fruits, nuts, seeds, trail mixes and granolas. Paterson, NJ.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   American Food & Beverage — shared stylesheet
   Palette : kraft paper, cocoa ink, terracotta, grassland green
   Type    : Fraunces (display) / Karla (body) / IBM Plex Mono (data)
   ========================================================================== */

:root{
  --paper:#F4EDE0;
  --paper-2:#EDE3D2;
  --kraft:#DFCEAD;
  --kraft-deep:#C9B183;
  --ink:#241A12;
  --ink-soft:#5C4A3A;
  --ink-faint:#8A7663;
  --terra:#AE4E28;
  --terra-deep:#8C3D1E;
  --grass:#3D6B37;
  --rule:rgba(36,26,18,.14);
  --rule-strong:rgba(36,26,18,.30);
  --white:#FFFCF6;

  --sp:clamp(1rem,3vw,2rem);
  --shell:1240px;
  --radius:3px;

  --shadow:0 1px 0 rgba(36,26,18,.06),0 12px 28px -18px rgba(36,26,18,.45);
}

*,*::before,*::after{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 12% 8%,rgba(201,177,131,.30),transparent 42%),
    radial-gradient(circle at 88% 4%,rgba(174,78,40,.08),transparent 38%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Karla",ui-sans-serif,system-ui,sans-serif;
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,h4{
  font-family:"Fraunces","Georgia",serif;
  font-weight:600;
  font-variation-settings:"SOFT" 30,"WONK" 1;
  line-height:1.05;
  letter-spacing:-.015em;
  margin:0 0 .5em;
  text-wrap:balance;
}
h1{font-size:clamp(2.4rem,6vw,4.5rem)}
h2{font-size:clamp(1.7rem,3.4vw,2.6rem)}
h3{font-size:1.25rem}
p{margin:0 0 1em;max-width:66ch}

a{color:var(--terra-deep);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--terra)}

img{max-width:100%;display:block}

:focus-visible{outline:2px solid var(--terra);outline-offset:3px;border-radius:2px}

.shell{max-width:var(--shell);margin-inline:auto;padding-inline:var(--sp)}
.narrow{max-width:74ch}

/* --- eyebrow / labels ------------------------------------------------ */
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 1rem;display:block;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* --- header ---------------------------------------------------------- */
.masthead{
  border-bottom:1px solid var(--rule);
  background:rgba(244,237,224,.92);
  backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:50;
}
.masthead-in{
  display:flex;align-items:center;gap:1.25rem;
  padding-block:.85rem;
}
.brand{display:flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--ink);flex:0 0 auto}
.brand b{font-family:"Fraunces",serif;font-size:1.15rem;letter-spacing:-.01em;font-weight:600}
.brand span{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:.3rem}

.nav{display:flex;gap:1.1rem;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav a{
  color:var(--ink-soft);text-decoration:none;font-size:.92rem;
  padding:.3rem 0;border-bottom:1.5px solid transparent;
}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--terra)}

/* mode stamp — the signature element */
.stamp{
  display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;
  overflow:hidden;background:var(--paper-2);
}
.stamp button{
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.5rem .7rem;border:0;background:transparent;
  color:var(--ink-soft);cursor:pointer;line-height:1;
}
.stamp button + button{border-left:1.5px solid var(--ink)}
.stamp button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stamp button:hover:not([aria-pressed="true"]){background:var(--kraft)}

.cartlink{
  font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;color:var(--ink);
  border:1px solid var(--rule-strong);padding:.5rem .7rem;border-radius:2px;
  white-space:nowrap;
}
.cartlink:hover{background:var(--kraft);color:var(--ink)}
.cartlink b{color:var(--terra-deep)}

/* --- buttons --------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font-family:"Karla",sans-serif;font-weight:700;font-size:.95rem;
  padding:.8rem 1.4rem;border-radius:var(--radius);border:1.5px solid var(--ink);
  background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;
  transition:transform .12s ease,background .12s ease;
}
.btn:hover{background:var(--terra-deep);border-color:var(--terra-deep);color:var(--white);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--kraft);color:var(--ink);border-color:var(--ink)}
.btn.small{padding:.45rem .8rem;font-size:.8rem}
.btn[disabled]{opacity:.45;pointer-events:none}

/* --- hero ------------------------------------------------------------ */
.hero{padding-block:clamp(3rem,8vw,6rem) clamp(2rem,5vw,4rem)}
.hero h1{margin-bottom:.35em}
.hero .lede{font-size:clamp(1.05rem,1.8vw,1.3rem);color:var(--ink-soft);max-width:56ch}

.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:end}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}}

/* running ticker of real SKUs — the "what we actually pack" wall */
.wall{
  border:1px solid var(--rule);border-radius:var(--radius);
  background:var(--white);padding:1rem 1.1rem;box-shadow:var(--shadow);
}
.wall-head{
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px dashed var(--rule-strong);padding-bottom:.6rem;margin-bottom:.5rem;
}
.wall-head span{font-family:"IBM Plex Mono",monospace;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.wall ol{list-style:none;margin:0;padding:0;font-family:"IBM Plex Mono",monospace;font-size:.78rem}
.wall li{display:flex;gap:.75rem;padding:.28rem 0;border-bottom:1px solid rgba(36,26,18,.06);align-items:baseline}
.wall li b{color:var(--terra-deep);font-weight:500;flex:0 0 auto}
.wall li em{font-style:normal;color:var(--ink-soft);margin-left:auto;flex:0 0 auto}
.wall li i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --- audience fork --------------------------------------------------- */
.fork{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;padding-block:1rem 4rem}
@media(max-width:760px){.fork{grid-template-columns:1fr}}
.fork-card{
  display:block;text-decoration:none;color:var(--ink);
  border:1.5px solid var(--ink);border-radius:var(--radius);
  background:var(--white);padding:clamp(1.5rem,3vw,2.25rem);
  position:relative;overflow:hidden;
  transition:transform .15s ease,box-shadow .15s ease;
}
.fork-card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -22px rgba(36,26,18,.6);color:var(--ink)}
.fork-card h2{margin-bottom:.3em}
.fork-card p{color:var(--ink-soft);font-size:.96rem;margin-bottom:1.25rem}
.fork-card .go{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--terra-deep)}
.fork-card::after{
  content:"";position:absolute;inset:auto -30% -60% auto;width:220px;height:220px;
  border-radius:50%;background:var(--kraft);opacity:.35;
}
.fork-card.wholesale::after{background:var(--terra);opacity:.10}

/* --- generic sections ------------------------------------------------ */
.band{padding-block:clamp(2.5rem,6vw,4.5rem);border-top:1px solid var(--rule)}
.band.tint{background:rgba(223,206,173,.35)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.75rem}
.cols h3{margin-bottom:.35em}
.cols p{font-size:.93rem;color:var(--ink-soft);margin:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.25rem;margin-top:1.5rem}
.stat{border-left:2px solid var(--terra);padding-left:.9rem}
.stat b{display:block;font-family:"Fraunces",serif;font-size:1.9rem;line-height:1}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}

/* --- catalog toolbar ------------------------------------------------- */
.toolbar{
  display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;
  padding-block:1.1rem;border-bottom:1px solid var(--rule);margin-bottom:1.5rem;
}
.toolbar .grow{flex:1 1 220px;min-width:0}

input[type=text],input[type=search],input[type=email],input[type=tel],select,textarea{
  font-family:"Karla",sans-serif;font-size:.95rem;color:var(--ink);
  background:var(--white);border:1px solid var(--rule-strong);border-radius:var(--radius);
  padding:.6rem .75rem;width:100%;
}
textarea{min-height:120px;resize:vertical}
input::placeholder{color:var(--ink-faint)}
label{display:block;font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.35rem}
.field{margin-bottom:1rem}

.chiprow{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;padding:.4rem .65rem;border:1px solid var(--rule-strong);
  border-radius:100px;background:transparent;cursor:pointer;color:var(--ink-soft);
}
.chip:hover{background:var(--kraft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.count{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-faint);letter-spacing:.08em}

/* --- retail grid ----------------------------------------------------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:1.1rem}
.card{
  border:1px solid var(--rule);border-radius:var(--radius);background:var(--white);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .14s ease,box-shadow .14s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card a.thumb{
  display:block;aspect-ratio:4/3;text-decoration:none;position:relative;
  background:var(--kraft);
}
.card a.thumb .glyph{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:"Fraunces",serif;font-size:2.6rem;color:rgba(36,26,18,.22);
}
.card .body{padding:.85rem .9rem 1rem;display:flex;flex-direction:column;flex:1}
.card .body h3{font-size:1rem;line-height:1.2;margin-bottom:.3rem}
.card .body h3 a{color:var(--ink);text-decoration:none}
.card .body h3 a:hover{color:var(--terra-deep)}
.card .meta{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink-faint);letter-spacing:.06em;margin-bottom:.7rem}
.card .foot{margin-top:auto;display:flex;align-items:center;gap:.6rem}
.card .price{font-family:"Fraunces",serif;font-size:1.1rem;font-weight:600}
.card .foot .btn{margin-left:auto}

.flag{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.6rem;
  letter-spacing:.1em;text-transform:uppercase;padding:.18rem .4rem;border-radius:2px;
  border:1px solid currentColor;margin-right:.3rem;
}
.flag.organic{color:var(--grass)}
.flag.kosher{color:var(--ink-faint)}

/* --- wholesale table -------------------------------------------------- */
.tablewrap{
  border:1px solid var(--rule-strong);border-radius:var(--radius);
  background:var(--white);overflow:auto;max-height:70vh;
}
table.sheet{border-collapse:collapse;width:100%;font-size:.88rem}
table.sheet th,table.sheet td{
  text-align:left;padding:.55rem .8rem;border-bottom:1px solid var(--rule);
  white-space:nowrap;
}
table.sheet thead th{
  position:sticky;top:0;background:var(--paper-2);z-index:2;
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);border-bottom:1.5px solid var(--ink);
}
table.sheet thead th button{
  all:unset;cursor:pointer;display:inline-flex;gap:.35rem;align-items:center;
}
table.sheet thead th button:hover{color:var(--terra-deep)}
table.sheet tbody tr:hover{background:rgba(223,206,173,.4)}
table.sheet tbody tr:focus-within{background:rgba(223,206,173,.55)}
table.sheet td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
table.sheet td.sku{font-family:"IBM Plex Mono",monospace;color:var(--terra-deep)}
table.sheet td.desc{white-space:normal;min-width:260px}
table.sheet td.desc a{color:var(--ink);text-decoration:none}
table.sheet td.desc a:hover{text-decoration:underline}
.sortmark{font-size:.6rem;color:var(--terra)}

.gated{
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.08em;
  color:var(--ink-faint);text-transform:uppercase;
}
.gated a{color:var(--terra-deep)}

/* --- product detail --------------------------------------------------- */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,3rem);padding-block:2.5rem}
@media(max-width:820px){.pdp{grid-template-columns:1fr}}
.pdp-visual{
  aspect-ratio:1/1;background:var(--kraft);border:1px solid var(--rule-strong);
  border-radius:var(--radius);display:grid;place-items:center;
}
.pdp-visual .glyph{font-family:"Fraunces",serif;font-size:5rem;color:rgba(36,26,18,.24)}
.pdp h1{font-size:clamp(1.9rem,4vw,3rem)}
.pdp .price{font-family:"Fraunces",serif;font-size:2rem;margin:.2em 0 .1em}
.pdp .per{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-faint);letter-spacing:.08em}
.buyrow{display:flex;gap:.6rem;align-items:center;margin:1.5rem 0}
.buyrow input{width:5.5rem;text-align:center;font-family:"IBM Plex Mono",monospace}

details.specs{
  border:1px solid var(--rule-strong);border-radius:var(--radius);
  background:var(--white);margin-top:1.5rem;
}
details.specs summary{
  cursor:pointer;padding:.85rem 1rem;list-style:none;
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between;
}
details.specs summary::-webkit-details-marker{display:none}
details.specs summary::after{content:"+";font-size:1rem;line-height:1}
details.specs[open] summary::after{content:"–"}
details.specs .inner{padding:0 1rem 1rem;border-top:1px solid var(--rule)}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1.25rem;margin:1rem 0 0;font-size:.9rem}
dl.spec dt{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);align-self:center}
dl.spec dd{margin:0;font-family:"IBM Plex Mono",monospace}

/* --- cart / tables ---------------------------------------------------- */
table.plain{width:100%;border-collapse:collapse;font-size:.93rem}
table.plain th,table.plain td{padding:.7rem .5rem;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.plain th{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
table.plain td.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.linkbtn{all:unset;cursor:pointer;color:var(--terra-deep);font-size:.82rem;text-decoration:underline}
.linkbtn:hover{color:var(--terra)}

.totals{margin-left:auto;max-width:340px;margin-top:1.5rem}
.totals div{display:flex;justify-content:space-between;padding:.4rem 0;font-family:"IBM Plex Mono",monospace;font-size:.88rem}
.totals div.grand{border-top:1.5px solid var(--ink);margin-top:.4rem;padding-top:.7rem;font-size:1.05rem;font-weight:700}

.panel{
  border:1px solid var(--rule-strong);border-radius:var(--radius);
  background:var(--white);padding:clamp(1.25rem,3vw,2rem);
}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
@media(max-width:640px){.formgrid{grid-template-columns:1fr}}
.formgrid .full{grid-column:1/-1}

.notice{
  border-left:3px solid var(--terra);background:rgba(174,78,40,.07);
  padding:.9rem 1rem;font-size:.9rem;border-radius:0 var(--radius) var(--radius) 0;margin-bottom:1.5rem;
}
.notice p{margin:0;max-width:none}

.empty{
  text-align:center;padding:4rem 1rem;border:1px dashed var(--rule-strong);
  border-radius:var(--radius);color:var(--ink-soft);
}
.empty h3{margin-bottom:.4em}

/* --- footer ------------------------------------------------------------ */
.foot{
  border-top:1.5px solid var(--ink);margin-top:4rem;padding-block:2.5rem 3rem;
  background:rgba(223,206,173,.4);
}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem}
@media(max-width:820px){.foot-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.foot-grid{grid-template-columns:1fr}}
.foot h4{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:400;margin-bottom:.8rem}
.foot ul{list-style:none;margin:0;padding:0;font-size:.9rem}
.foot li{margin-bottom:.4rem}
.foot a{color:var(--ink-soft);text-decoration:none}
.foot a:hover{color:var(--terra-deep);text-decoration:underline}
.foot .legal{margin-top:2rem;padding-top:1.25rem;border-top:1px solid var(--rule);font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink-faint);letter-spacing:.06em}

.certs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
.certs span{
  font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule-strong);padding:.3rem .5rem;border-radius:2px;color:var(--ink-soft);
}

.skip{position:absolute;left:-9999px}
.skip:focus{left:.5rem;top:.5rem;position:fixed;z-index:100;background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:2px}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

@media print{
  .masthead,.foot,.toolbar,.chiprow{display:none}
  body{background:#fff}
  .tablewrap{max-height:none;border:0}
}

/* --- order minimums ---------------------------------------------------- */
.meter{
  border:1px solid var(--rule-strong);border-radius:var(--radius);
  background:var(--white);padding:.9rem 1rem;margin-top:1.5rem;
}
.meter .bar{
  height:6px;background:var(--kraft);border-radius:100px;overflow:hidden;margin:.6rem 0 .5rem;
}
.meter .bar i{display:block;height:100%;background:var(--terra);transition:width .25s ease}
.meter.met .bar i{background:var(--grass)}
.meter p{
  margin:0;font-family:"IBM Plex Mono",monospace;font-size:.72rem;
  letter-spacing:.06em;color:var(--ink-soft);max-width:none;
}
.meter.met p{color:var(--grass)}
.meter strong{font-weight:500;color:var(--ink)}

td.moq{font-family:"IBM Plex Mono",monospace;text-align:right;color:var(--ink-faint)}
tr.under td.moq{color:var(--terra-deep)}

  .joblist{display:grid;gap:1rem;margin-top:1.5rem}
  .job{
    border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--white);
    padding:1.1rem 1.25rem;
  }
  .job-head{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline}
  .job-head h3{margin:0;font-size:1.2rem}
  .job .pay{
    font-family:"IBM Plex Mono",monospace;font-size:.85rem;color:var(--terra-deep);
    margin-left:auto;white-space:nowrap;font-weight:500;
  }
  .job .tags{
    font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-faint);margin:.4rem 0 .7rem;
  }
  .job p.sum{margin:0 0 .9rem;color:var(--ink-soft);font-size:.95rem}
  .job details{margin-bottom:.9rem}
  .job details summary{
    cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:.7rem;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
  }
  .job details ul{margin:.7rem 0 0;padding-left:1.1rem;font-size:.92rem;color:var(--ink-soft)}
  .job details li{margin-bottom:.3rem}
  .job details h4{margin:.9rem 0 0;font-family:"Karla",sans-serif;font-size:.85rem}
  .langbar{display:flex;gap:.4rem;margin-bottom:1rem}
  #applyPanel{scroll-margin-top:90px}
  .req{color:var(--terra-deep)}

n\n---\n\n## 1. Purpose\n\nTo set expectations for in-house sales and customer support so that customers get a\nconsistent answer regardless of who picks up the phone.\n\n## 2. Responsibilities\n\n### 2.1 In-house sales\n- Handle inbound sales inquiries.\n- Follow up on leads and close sales.\n- Maintain accurate records in Badger.\n- Work with marketing so sales effort and promotion line up.\n\n### 2.2 Customer support\n- Address customer inquiries and resolve issues promptly.\n- Provide product information and support.\n- Document every customer interaction \u2014 the next person to speak to that customer relies on it.\n- Escalate what you cannot resolve, rather than sitting on it.\n\n## 3. What we handle and what the rep handles\n\n| Support team handles | Sales rep handles |\n|---|---|\n| Routine order entry and reorders | Prospecting and new accounts |\n| Shipment tracking and delivery confirmation | Strategic account relationships |\n| Basic service inquiries | In-person visits |\n| New customer paperwork and setup | Pricing and contract discussion |\n| Order status updates | Merchandising audits |\n\nCollaborative: complex issue resolution, new customer onboarding, large or custom orders,\ncustomer complaints.\n\n## 4. Guidelines\n\n- Follow company policy on client interactions.\n- Use Badger and Pepperi rather than personal notes or spreadsheets.\n- Professional and courteous at all times, including when the customer is not.\n- Return calls and emails within one business day, same day where possible.\n- If you commit to something, do it \u2014 or call back and say you can't.\n\n## 5. Escalation\n\n| Urgency | Examples | Route | Response expected |\n|---|---|---|---|\n| **Immediate** | Damaged or wrong product delivered \u00b7 safety or health concern \u00b7 billing error \u00b7 failed delivery \u00b7 customer threatening to leave | Sales Manager or Customer Support Manager, by phone | Within 1 hour |\n| **Same day** | Quality complaint \u00b7 service dissatisfaction \u00b7 unresolved recurring issue \u00b7 return or refund request | Manager, by phone or email | Same business day |\n| **Standard** | Process suggestions \u00b7 documentation gaps \u00b7 system issues \u00b7 material requests | Email or portal ticket | 1\u20132 business days |\n\nA useful escalation names the customer, states the problem in facts, says what you have\nalready done, makes a specific request and gives the deadline. \"Customer is upset, please\ncall them\" is not an escalation.\n\n## 6. Records\n\nEvery interaction is documented in Badger while it is fresh. Feedback and recurring complaints\nare flagged for the Customer Support Manager, because three customers reporting the same thing\nis a process problem, not three incidents.\n\n---\n\n## Revision history\n\n| Version | Date | Author | Change |\n|---|---|---|---|\n| 1.0 | *(pending)* | Customer Support Manager | First controlled issue. Consolidates and supersedes `SOP_for_In-House_Sales_and_Customer_Support_Personnel.pdf`, which carried no version, owner, approval or review date. Escalation timeframes added, and the sales/support split made explicit to match `TRN-SLS-001`. |\n","sections":["Purpose","Responsibilities","What we handle and what the rep handles","Guidelines","Escalation","Records","Revision history"],"derivedDuties":["Handle inbound sales inquiries.","Follow up on leads and close sales.","Maintain accurate records in Badger.","Work with marketing so sales effort and promotion line up.","Address customer inquiries and resolve issues promptly."]},{"code":"SOP-PKG-001","title":"Cleaning tables between packing different products","version":"1.0","status":"active","pendingApproval":true,"scope":"sqf","docType":"procedure","department":"Packing Room","roles":["Packer \u2014 Production","Sanitation Technician","Packing Room Manager"],"owner":"SQF Practitioner","approver":null,"effectiveDate":null,"reviewCycle":"Annual, or on any change to products, chemicals or equipment","supersedes":"Standard_Operating_Procedure_For_Cleaning_Packing_Room.docx","generatesRecord":"cleaning_log","criticalControl":true,"confidential":false,"sourceFile":"SOP-PKG-001.md","body":"<!-- Controlled document. The current version lives in the AFB operations\nportal. A printed copy is uncontrolled once it leaves the screen. -->\n\n# SOP-PKG-001 \u00b7 Cleaning tables between packing different products\n\n| Field | Value |\n|---|---|\n| Document code | `SOP-PKG-001` |\n| Version | 1.0 |\n| Status | Active \u2014 pending approval |\n| Scope | **SQF \u2014 food safety.** This is a food safety control. Deviation is a deviation, not a preference. |\n| Department | Packing Room |\n| Applies to | Packer \u2014 Production \u00b7 Sanitation Technician \u00b7 Packing Room Manager |\n| Owner | SQF Practitioner |\n| Approved by | ______________________  *(signature required before issue)* |\n| Effective date | ______________________ |\n| Review cycle | Annual, or on any change to products, chemicals or equipment |\n| Supersedes | Standard_Operating_Procedure_For_Cleaning_Packing_Room.docx |\n| Records generated | Cleaning log \u2014 one entry per changeover and per end of day |\n\n---\n\n## 1. Purpose\n\nTo ensure a hygienic, contamination-free packing area by thoroughly cleaning tables and\nequipment between different food products.\n\n## 2. Why this matters\n\nThis facility handles **peanuts, tree nuts, sesame, milk and soy**. A changeover between two\nproducts is therefore an allergen control point, not a housekeeping task. Product packed on an\ninadequately cleaned table can injure a consumer and will be recalled.\n\n## 3. Responsibilities\n\n| Who | Does what |\n|---|---|\n| Packer / Sanitation Technician | Performs the clean and records it |\n| Packing Room Manager | Verifies allergen changeovers before the line restarts |\n| SQF Practitioner | Owns this procedure, reviews records, retains them |\n\n## 4. Materials\n\n- Cleaning cloths\n- Brushes, assorted sizes\n- Detergent \u2014 spray bottle labelled **Table Cleaner**\n- Sanitizer \u2014 spray bottle labelled **Sanitizing Cleaner**\n- Water spray bottles\n- Face mask, protective gloves, safety goggles\n- Cleaning log (portal, or paper backup)\n\nChemicals are used only from correctly labelled bottles. An unlabelled bottle is not used.\n\n## 5. Procedure\n\n### 5.1 Preparation\n1. Put on PPE: gloves, safety goggles, face mask.\n2. Remove all food product from the packing area.\n3. Disconnect packing equipment from power.\n4. Remove equipment from the tables, including scales.\n\n### 5.2 Initial cleaning\n5. Remove visible food residue using brushes or cloths.\n6. Dispose of residue in the appropriate waste containers.\n\n### 5.3 Wash\n7. Apply **Table Cleaner** to all surfaces and parts.\n8. Brush into crevices and hard-to-reach areas.\n9. Rinse all surfaces with clean water until no soap residue remains.\n\n### 5.4 Sanitize\n10. Apply **Sanitizing Cleaner** to all surfaces and parts, to full coverage.\n11. **Leave for a contact time of 10 minutes.** Do not wipe, rinse or reassemble early.\n    Shortening contact time invalidates the clean.\n\n### 5.5 Reassembly and inspection\n12. Air-dry, or dry with clean towels.\n13. Reassemble only once every part is completely dry.\n14. Inspect for cleanliness. Any residue means return to 5.2.\n\n### 5.6 Record\n15. Record in the cleaning log, before the line restarts:\n    date and time, area and equipment, product before, product after, whether this was an\n    allergen changeover, sanitizer contact time, who performed it.\n16. On an allergen changeover, the Packing Room Manager verifies and signs.\n\n### 5.7 Restart\n17. Reconnect power.\n18. Run a test batch with water or empty to confirm no cleaning residue carries over.\n19. Resume packing with the new product.\n\n### 5.8 End of day\n20. Repeat 5.1 to 5.7.\n21. Additionally: clean and sanitize floors and surrounding work surfaces; empty and sanitize\n    waste containers; clean and store all cleaning equipment.\n22. Verify the whole packing area is clean, sanitized and ready for the next day.\n\n## 6. Records\n\n| Record | Where | Retained |\n|---|---|---|\n| Cleaning log \u2014 changeover | Operations portal | Per retention schedule |\n| Cleaning log \u2014 end of day | Operations portal | Per retention schedule |\n\nRecords are entered as the work is done, not reconstructed at the end of a shift.\n\n## 7. If something goes wrong\n\n| Situation | Do this |\n|---|---|\n| Contact time was cut short | Do not restart. Re-sanitize with full contact time. Record what happened. |\n| Residue found after reassembly | Strip down and return to 5.2. Record it. |\n| Test batch is not clear | Do not restart. Notify the Packing Room Manager. |\n| Chemical unlabelled or missing | Stop. Notify the Packing Room Manager. Do not substitute. |\n\nAny of the above is reported to the Packing Room Manager the same shift, and to the SQF\nPractitioner the same day.\n\n---\n\n## Revision history\n\n| Version | Date | Author | Change |\n|---|---|---|---|\n| 1.0 | *(pending)* | SQF Practitioner | First controlled issue. Consolidates and supersedes `Standard_Operating_Procedure_For_Cleaning_Packing_Room.docx`, which carried no version, owner, approval or review date. Wording unchanged in substance; structure, responsibilities and record requirements made explicit. |\n","sections":["Purpose","Why this matters","Responsibilities","Materials","Procedure","Records","If something goes wrong","Revision history"],"derivedDuties":["Put on PPE: gloves, safety goggles, face mask.","Remove all food product from the packing area.","Disconnect packing equipment from power.","Remove equipment from the tables, including scales.","Remove visible food residue using brushes or cloths."]},{"code":"SOP-SLS-001","title":"Sales representative \u2014 routine and targets","version":"1.0","status":"active","pendingApproval":true,"scope":"business","docType":"role_sop","department":"Sales","roles":["Sales Representative"],"owner":"Sales Director","approver":null,"effectiveDate":null,"reviewCycle":"Annual, or on any change to targets","supersedes":"SOP_for_Sales_Team_Members.pdf","generatesRecord":null,"criticalControl":false,"confidential":false,"sourceFile":"SOP-SLS-001.md","body":"<!-- Controlled document. The current version lives in the AFB operations\nportal. A printed copy is uncontrolled once it leaves the screen. -->\n\n# SOP-SLS-001 \u00b7 Sales representative \u2014 routine and targets\n\n| Field | Value |\n|---|---|\n| Document code | `SOP-SLS-001` |\n| Version | 1.0 |\n| Status | Active \u2014 pending approval |\n| Scope | Business process. Not SQF-scoped. |\n| Department | Sales |\n| Applies to | Sales Representative |\n| Owner | Sales Director |\n| Approved by | ______________________  *(signature required before issue)* |\n| Effective date | ______________________ |\n| Review cycle | Annual, or on any change to targets |\n| Supersedes | SOP_for_Sales_Team_Members.pdf |\n| Records generated | CRM activity log (Badger) \u00b7 Orders (Pepperi) \u00b7 Weekly report |\n\n---\n\n## 1. Purpose\n\nTo set out what a Sales Representative does daily, weekly and monthly, and the targets the\nrole is measured against.\n\n## 2. Systems\n\nTwo systems, one job. Use both; neither is optional.\n\n| System | Used for |\n|---|---|\n| **Badger** | Customers, territory, routes, visit logging, activity tracking |\n| **Pepperi** | Product catalog, pricing, order entry, customer portal |\n\nBadger is the master record for customer information. Enter it there first; Pepperi syncs.\n\n## 3. Targets\n\n> **Reconciliation note.** The superseded version of this SOP set 30 new customers per\n> quarter. `TRN-SLS-001` sets 5 per week, which is about 65 per quarter \u2014 more than double.\n> Revenue reconciled; customer count did not. The figures below adopt the Train the Trainers\n> rate, because it is the one derived from the stated $3M to $6M business case.\n> **The Sales Director must confirm this before issue.**\n\nEverything derives from one weekly number.\n\n| Period | New customers | Sales volume |\n|---|---|---|\n| **Weekly** | 5 | $12,500 |\n| Monthly *(derived, 4 weeks)* | 20 | $50,000 |\n| Quarterly *(derived, 13 weeks)* | 65 | $162,500 |\n\nTo reach 5 new customers a week, the funnel is: 25 prospects identified \u2192 15 discovery calls\n\u2192 10 proposals \u2192 5 closed. Falling short at the end usually means falling short at the start.\n\n## 4. Daily\n\n- Visit your assigned territory.\n- Meet at least 5 clients or prospects in person.\n- Complete 10 meaningful customer touchpoints (the Daily 10 \u2014 see `TRN-SLS-001`).\n- Spend one hour prospecting, ideally first thing.\n- Log every activity in Badger the same day, not the next.\n\n## 5. Weekly\n\n- Submit your weekly report.\n- Attend the team meeting.\n- Identify 25 new qualified prospects.\n- Review your funnel against target with your Sales Team Leader.\n\n## 6. Monthly\n\n- Attend the monthly sales training session.\n- Review territory coverage: which customers have not been touched, and why.\n\n## 7. Records\n\nNothing counts unless it is logged. A visit not recorded in Badger did not happen, an order\nnot entered in Pepperi cannot be picked, and neither can be credited to you.\n\n## 8. Escalation\n\n| Raise it to | When |\n|---|---|\n| Sales Team Leader | Anything blocking your territory, targets or accounts |\n| Support team | Order, delivery, billing or service problems \u2014 see `SOP-CS-001` |\n| Sales Director | Escalated by your Team Leader, or a risk of losing a major account |\n\n---\n\n## Revision history\n\n| Version | Date | Author | Change |\n|---|---|---|---|\n| 1.0 | *(pending)* | Sales Director | First controlled issue. Consolidates and supersedes `SOP_for_Sales_Team_Members.pdf`, which carried no version, owner, approval or review date. **Targets reconciled with `TRN-SLS-001`, which previously disagreed \u2014 see section 3. Requires Sales Director sign-off.** |\n","sections":["Purpose","Systems","Targets","Daily","Weekly","Monthly","Records","Escalation","Revision history"],"derivedDuties":["Visit your assigned territory.","Meet at least 5 clients or prospects in person.","Complete 10 meaningful customer touchpoints (the Daily 10 \u2014 see TRN-SLS-001).","Spend one hour prospecting, ideally first thing.","Log every activity in Badger the same day, not the next."]},{"code":"SOP-SLS-002","title":"New Jersey sales territories","version":"1.0","status":"draft","pendingApproval":false,"scope":"business","docType":"role_sop","department":"Sales","roles":["Sales Representative","Sales Team Leader \u2014 New Jersey"],"owner":"Sales Team Leader \u2014 New Jersey","approver":null,"effectiveDate":null,"reviewCycle":"Annual, or whenever an assignment changes","supersedes":"SOP_for_New_Jersey_Sales_Territories.pdf","generatesRecord":null,"criticalControl":false,"confidential":false,"sourceFile":"SOP-SLS-002.md","body":"<!-- Controlled document. The current version lives in the AFB operations\nportal. A printed copy is uncontrolled once it leaves the screen. -->\n\n# SOP-SLS-002 \u00b7 New Jersey sales territories\n\n| Field | Value |\n|---|---|\n| Document code | `SOP-SLS-002` |\n| Version | 1.0 |\n| Status | **Draft \u2014 cannot be issued until territories are assigned to named people** |\n| Scope | Business process. Not SQF-scoped. |\n| Department | Sales |\n| Applies to | Sales Representative \u00b7 Sales Team Leader \u2014 New Jersey |\n| Owner | Sales Team Leader \u2014 New Jersey |\n| Approved by | ______________________  *(signature required before issue)* |\n| Effective date | ______________________ |\n| Review cycle | Annual, or whenever an assignment changes |\n| Supersedes | SOP_for_New_Jersey_Sales_Territories.pdf |\n| Records generated | CRM territory assignment (Badger) |\n\n---\n\n## 1. Purpose\n\nTo define the New Jersey territories, who owns each, and how coverage is maintained.\n\n## 2. Territories\n\n| Territory | Assigned to | Covers |\n|---|---|---|\n| North Jersey | ______________________ | *(define \u2014 counties or ZIP ranges)* |\n| Central Jersey | ______________________ | *(define)* |\n| South Jersey | ______________________ | *(define)* |\n| Jersey Shore | ______________________ | *(define)* |\n| Western NJ | ______________________ | *(define)* |\n\n> The superseded document assigned these to \"Sales Rep 1\" through \"Sales Rep 5\". Placeholders\n> are not assignments. Until real names and boundaries are entered, this document stays in\n> draft and is not issued to the team.\n\nBoundaries matter as much as names. Two reps calling the same grocer is worse than neither\ncalling.\n\n## 3. Expectations within a territory\n\n- Visit your assigned territory daily.\n- Build and maintain relationships with local retailers and distributors.\n- Meet the targets in `SOP-SLS-001`.\n- Keep Badger's territory assignment accurate \u2014 routing depends on it.\n\n## 4. Coverage gaps\n\nReview territory coverage monthly. Any customer not touched in 30 days is flagged and either\nvisited or reassigned. An account nobody has called in a quarter is not a customer, it is a\nprospect a competitor is working.\n\n## 5. Records\n\nTerritory assignment lives in Badger and is the single source of truth. Changes are made\nthere, then reflected here at the next revision.\n\n## 6. Escalation\n\nIssues, disputes over account ownership, or coverage that cannot be met go to the\n**Sales Team Leader \u2014 New Jersey**, then to the Sales Director.\n\n---\n\n## Revision history\n\n| Version | Date | Author | Change |\n|---|---|---|---|\n| 1.0 | *(pending)* | Sales Team Leader \u2014 New Jersey | First controlled issue. Consolidates and supersedes `SOP_for_New_Jersey_Sales_Territories.pdf`, which carried no version, owner, approval or review date. Placeholder assignments (\\\"Sales Rep 1\\\" to \\\"Sales Rep 5\\\") retained as blanks rather than invented. Document held in draft until filled. |\n","sections":["Purpose","Territories","Expectations within a territory","Coverage gaps","Records","Escalation","Revision history"],"derivedDuties":[]},{"code":"SOP-SLS-003","title":"Sales Director","version":"1.0","status":"active","pendingApproval":true,"scope":"business","docType":"role_sop","department":"Sales","roles":["Sales Director"],"owner":"Senior management","approver":null,"effectiveDate":null,"reviewCycle":"Annual","supersedes":"SOP_for_Sales_Director.pdf","generatesRecord":null,"criticalControl":false,"confidential":false,"sourceFile":"SOP-SLS-003.md","body":"<!-- Controlled document. The current version lives in the AFB operations\nportal. A printed copy is uncontrolled once it leaves the screen. -->\n\n# SOP-SLS-003 \u00b7 Sales Director\n\n| Field | Value |\n|---|---|\n| Document code | `SOP-SLS-003` |\n| Version | 1.0 |\n| Status | Active \u2014 pending approval |\n| Scope | Business process. Not SQF-scoped. |\n| Department | Sales |\n| Applies to | Sales Director |\n| Owner | Senior management |\n| Approved by | ______________________  *(signature required before issue)* |\n| Effective date | ______________________ |\n| Review cycle | Annual |\n| Supersedes | SOP_for_Sales_Director.pdf |\n| Records generated | Monthly performance report \u00b7 Quarterly development update |\n\n---\n\n## 1. Purpose\n\nTo define the responsibilities, reporting and escalation of the Sales Director.\n\n## 2. Scope of the role\n\nSales operations across **NYC, New Jersey and surrounding areas**.\n\n## 3. Responsibilities\n\n1. Develop and implement sales strategy against company goals.\n2. Monitor and evaluate the performance of Sales Team Leaders and their teams.\n3. Meet Sales Team Leaders regularly to review progress and address obstacles.\n4. Align sales and promotional effort with marketing.\n5. Approve budgets and resource allocation for sales activity.\n6. Ensure compliance with company policy and industry regulation.\n7. Own the targets in `SOP-SLS-001` \u2014 including approving any change to them.\n\n## 4. Where this role sits\n\n```\nSenior management\n      \u2191\nSales Director  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n      \u2191                         \u2502\nSales Team Leaders              \u2502  (in-house sales and customer\n      \u2191                         \u2502   support escalate via SOP-CS-001)\nSales Representatives           \u2502\n                                \u2193\n                        Support team managers\n```\n\n## 5. Reporting\n\n| What | To whom | When |\n|---|---|---|\n| Sales performance report | Senior management | Monthly |\n| Team development and market expansion update | Senior management | Quarterly |\n| Critical issues or risks | Senior management | Immediately |\n\n## 6. Guidelines\n\n- Keep communication open with Sales Team Leaders; provide guidance rather than waiting to be\n  asked.\n- Use Badger and Pepperi reporting for overall performance rather than assembled spreadsheets.\n- Address issues escalated by Sales Team Leaders promptly, and close the loop with the person\n  who raised them.\n\n## 7. Escalation\n\nCritical issues or risks go to senior management immediately, not in the next monthly report.\n\n---\n\n## Revision history\n\n| Version | Date | Author | Change |\n|---|---|---|---|\n| 1.0 | *(pending)* | Senior management | First controlled issue. Consolidates and supersedes `SOP_for_Sales_Director.pdf`, which carried no version, owner, approval or review date. Reporting lines aligned with `SOP-SLS-001`, `SOP-SLS-002` and `SOP-CS-001`. |\n","sections":["Purpose","Scope of the role","Responsibilities","Where this role sits","Reporting","Guidelines","Escalation","Revision history"],"derivedDuties":["Develop and implement sales strategy against company goals.","Monitor and evaluate the performance of Sales Team Leaders and their teams.","Meet Sales Team Leaders regularly to review progress and address obstacles.","Align sales and promotional effort with marketing.","Approve budgets and resource allocation for sales activity."]},{"code":"TRN-SLS-001","title":"Sales training and certification program","version":"2.0","status":"active","pendingApproval":true,"scope":"business","docType":"training_program","department":"Sales","roles":["Sales Director","Sales Representative","Customer Service Representative"],"owner":"Sales Director","approver":null,"effectiveDate":null,"reviewCycle":"Quarterly review of content, annual full refresh","supersedes":"Train_The_Trainers_Guide.docx v1.0","generatesRecord":null,"criticalControl":false,"confidential":true,"sourceFile":"TRN-SLS-001.md","body":"<!-- Controlled document. The current version lives in the AFB operations\nportal. A printed copy is uncontrolled once it leaves the screen. -->\n\n# TRN-SLS-001 \u00b7 Sales training and certification program\n\n| Field | Value |\n|---|---|\n| Document code | `TRN-SLS-001` |\n| Version | 2.0 |\n| Status | Active \u2014 pending approval |\n| Scope | Business process. Not SQF-scoped. **Confidential \u2014 internal use only.** |\n| Department | Sales |\n| Applies to | Sales Director \u00b7 Sales Representative \u00b7 Customer Service Representative |\n| Owner | Sales Director |\n| Approved by | ______________________  *(signature required before issue)* |\n| Effective date | ______________________ |\n| Review cycle | Quarterly review of content, annual full refresh |\n| Supersedes | Train_The_Trainers_Guide.docx v1.0 |\n| Records generated | Training record per person, per module, with score and expiry |\n\n---\n\n## 1. Purpose\n\nTo define how sales staff are trained, assessed, certified and re-certified \u2014 and what\nrecords that produces.\n\n> The superseded guide runs to about forty pages and mixes three things: the commitments\n> (targets, pass marks, certification rules), the curriculum, and facilitation notes for\n> trainers. Only the commitments belong in a controlled document, because only they get\n> audited and only they need version control. The curriculum and facilitation notes continue\n> as **Trainer Annex A**, uncontrolled and free to change between sessions.\n\n## 2. Business case\n\n| | |\n|---|---|\n| Current annual volume | $3M |\n| Target annual volume | $6M |\n| Route | 5 new customers per rep per week, systematically prospected |\n\nThis is the source of the target in `SOP-SLS-001`. If this number changes, that SOP changes\nwith it.\n\n## 3. Cascade structure\n\n| Tier | Who | How many | Certified in |\n|---|---|---|---|\n| 1 | Master trainers | 2\u20133 | Weeks 1\u20132 |\n| 2 | Regional trainers | 9 | Weeks 3\u20134 |\n| 3 | Sales representatives | 27+ | Weeks 5\u20138 |\n\nEach tier certifies the one below it. A trainer may not train a tier until certified.\n\n## 4. Competency areas\n\n1. Platform mastery \u2014 Badger and Pepperi\n2. Customer engagement \u2014 the Daily 10, visits, merchandising audits\n3. Prospecting \u2014 qualification, discovery, closing\n4. Product knowledge and positioning\n5. Support team collaboration\n\n## 5. Certification\n\n### Stage 1 \u2014 Knowledge\n| Assessment | Pass mark |\n|---|---|\n| Badger platform exam | 90% |\n| Pepperi platform exam | 90% |\n| Sales strategy assessment | 85% |\n\n### Stage 2 \u2014 Skills\n| Assessment | Pass mark |\n|---|---|\n| Badger skills demonstration | 90% |\n| Pepperi skills demonstration | 90% |\n| Role-play scenarios (3) | 72% average |\n\n### Stage 3 \u2014 Field\n| Assessment | Requirement |\n|---|---|\n| Observed customer visits | 3 visits, 85% average |\n| Daily 10 | 5 consecutive days, logged in Badger |\n| New customers closed | 1\u20132, prospecting through to close |\n\n**Retakes:** two per stage. After a second failure, the participant, their manager and a\nmaster trainer review whether further coaching, a different role, or an external obstacle is\nthe right answer.\n\n## 6. Maintaining certification\n\n| Check | Frequency |\n|---|---|\n| Competency spot-check | Quarterly |\n| Recertification | Annual |\n\nMinimum standing to remain certified:\n\n- 5 new customers per week, averaged\n- Daily 10 achieved on 80% or more of working days\n- 95%+ daily platform usage\n- Customer satisfaction 4.5 / 5 or better\n\n## 7. Records\n\nEvery assessment produces a training record: person, module, score, pass mark, outcome,\nassessor, date, expiry. Certification expires twelve months from the date of the last passing\nStage 3 assessment, and the holder and their manager are alerted 60 days ahead.\n\n## 8. Definitions\n\n| Term | Meaning |\n|---|---|\n| **Daily 10** | Ten meaningful customer touchpoints per day. Mass email, voicemail without a conversation, and generic social likes do not count. |\n| **BANT** | Budget, Authority, Need, Timing \u2014 prospect qualification. |\n| **SPIN** | Situation, Problem, Implication, Need-payoff \u2014 discovery questioning. |\n| **ICP** | Ideal customer profile. |\n| **Badger** | CRM: customers, territory, routes, activity. |\n| **Pepperi** | Orders: catalog, pricing, order entry, customer portal. |\n\n---\n\n## Revision history\n\n| Version | Date | Author | Change |\n|---|---|---|---|\n| 1.0 | *(pending)* | Sales Director | First controlled issue. Consolidates and supersedes `Train_The_Trainers_Guide.docx v1.0`, which carried no version, owner, approval or review date. Reduced from a 40-page guide to the parts that are auditable commitments. Full facilitation content retained as a separate trainer annex. Targets now match `SOP-SLS-001`. |\n","sections":["Purpose","Business case","Cascade structure","Competency areas","Certification","Maintaining certification","Records","Definitions","Revision history"],"derivedDuties":[]}],"openItems":{"awaitingControlFields":[{"code":"SOP-CS-001","missing":["approver","effective date"]},{"code":"SOP-PKG-001","missing":["approver","effective date"]},{"code":"SOP-SLS-001","missing":["approver","effective date"]},{"code":"SOP-SLS-002","missing":["approver","effective date"]},{"code":"SOP-SLS-003","missing":["approver","effective date"]},{"code":"TRN-SLS-001","missing":["approver","effective date"]}],"awaitingDecision":[{"code":"SOP-SLS-001","item":"New customer target reconciled to 5/week (65/quarter) from the previous 30/quarter. Sales Director must confirm."},{"code":"SOP-SLS-002","item":"Five NJ territories have no named owner and no defined boundaries. Held in draft."}]}};window.AFB_DEMO=true;</script>

var ROUTES = {"index": {"title": "American Food &amp; Beverage \u2014 nuts, dried fruit and trail mixes packed in Paterson, NJ", "body": "\n\n  <section class=\"shell hero\">\n    <div class=\"hero-grid\">\n      <div>\n        <span class=\"eyebrow\">Paterson, New Jersey &middot; since the first pallet</span>\n        <h1>We buy it whole, roast it here, and pack it the way you need it.</h1>\n        <p class=\"lede\">Dried fruit, nuts, seeds, trail mixes, granolas, plantain chips and chocolate-covered\n        everything &mdash; sourced direct from growers and packers, finished in our own 60,000&nbsp;sq&nbsp;ft\n        facility, on your dock tomorrow.</p>\n        <p style=\"margin-top:1.75rem\">\n          <a class=\"btn\" href=\"#/shop\">Browse the catalog</a>\n          <a class=\"btn ghost\" href=\"#/quote\" style=\"margin-left:.5rem\">Request wholesale pricing</a>\n        </p>\n      </div>\n\n      <div class=\"wall\" aria-hidden=\"true\">\n        <div class=\"wall-head\"><span>On the line today</span><span data-wall-count></span></div>\n        <ol data-wall></ol>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"shell fork\">\n    <a class=\"fork-card\" href=\"#/shop\" data-fork=\"retail\">\n      <span class=\"eyebrow\">For your kitchen</span>\n      <h2>Shop retail</h2>\n      <p>Jars, cups and containers you can buy one at a time. Photography, portion sizes,\n      and what's actually in the mix &mdash; no item numbers in your way.</p>\n      <span class=\"go\">Start shopping &rarr;</span>\n    </a>\n    <a class=\"fork-card wholesale\" href=\"#/shop\" data-fork=\"wholesale\">\n      <span class=\"eyebrow\">For your warehouse</span>\n      <h2>Wholesale &amp; foodservice</h2>\n      <p>The full sheet: item numbers, case pack, unit weight, packaging format. Sort it,\n      filter it, export it, build a quote. Pricing opens once your account is set up.</p>\n      <span class=\"go\">Open the item sheet &rarr;</span>\n    </a>\n  </section>\n\n  <section class=\"band tint\">\n    <div class=\"shell\">\n      <span class=\"eyebrow\">What we run</span>\n      <h2>One facility, ten categories, every pack size you'd ask for.</h2>\n      <div class=\"stats\">\n        <div class=\"stat\"><b data-stat=\"skus\">\u2014</b><span>Active SKUs</span></div>\n        <div class=\"stat\"><b>60,000</b><span>Sq ft, Paterson NJ</span></div>\n        <div class=\"stat\"><b>7</b><span>Packaging formats</span></div>\n        <div class=\"stat\"><b>Next day</b><span>Tri-State, own fleet</span></div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"band\">\n    <div class=\"shell\">\n      <span class=\"eyebrow\">How we're different</span>\n      <div class=\"cols\">\n        <div>\n          <h3>We roast and flavor it ourselves</h3>\n          <p>Nothing is bought finished and relabeled. Marcona almonds with truffle, caramelized\n          walnuts, honey sesame crunch &mdash; all done on site, which is why we can change a recipe\n          for you without changing suppliers.</p>\n        </div>\n        <div>\n          <h3>Custom packing is normal here</h3>\n          <p>Sixteen-ounce clear containers, screw-top jars, to-go cups for a cup holder, big\n          presentation trays, or your own film and label. Same product, seven ways.</p>\n        </div>\n        <div>\n          <h3>The certifications are real and current</h3>\n          <p>SQF certified facility, USDA Organic handler, OU Kosher. We keep the paperwork\n          ready because your QA team is going to ask for it before your first order ships.</p>\n        </div>\n        <div>\n          <h3>Our trucks, our schedule</h3>\n          <p>A private fleet across the Tri-State area with next-day delivery, plus contracted\n          trucking for the rest of the country. Delivery dates you can hold a promotion to.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"band tint\">\n    <div class=\"shell narrow\">\n      <span class=\"eyebrow\">Who we ship to</span>\n      <h2>Supermarket chains, independent grocers, distributors, restaurants, hotels, airlines.</h2>\n      <p>If you need one pallet a month or a truckload a week, the answer is the same phone number.\n      Start with the item sheet, mark what you want, and we'll come back with pricing and lead times.</p>\n      <p style=\"margin-top:1.5rem\">\n        <a class=\"btn\" href=\"#/wholesale\">See how ordering works</a>\n        <a class=\"btn ghost\" href=\"#/private-label\" style=\"margin-left:.5rem\">Private label &amp; custom packing</a>\n      </p>\n    </div>\n  </section>\n\n", "scripts": ["\ndocument.querySelectorAll(\"[data-fork]\").forEach(function(a){\n  a.addEventListener(\"click\",function(){ AFB.setMode(a.dataset.fork); });\n});\n\nAFB.catalog().then(function(data){\n  var p = data.products;\n  document.querySelector('[data-stat=\"skus\"]').textContent = p.length;\n  document.querySelector(\"[data-wall-count]\").textContent = p.length + \" items\";\n\n  // a rotating sample of the real sheet \u2014 this is the thing we actually sell\n  var list = document.querySelector(\"[data-wall]\");\n  function sample(){\n    var pick = [], used = {};\n    while (pick.length < 9){\n      var r = p[Math.floor(Math.random()*p.length)];\n      if (used[r.item]) continue; used[r.item] = 1; pick.push(r);\n    }\n    list.innerHTML = pick.map(function(r){\n      return \"<li><b>\"+r.item+\"</b><i>\"+r.name+\"</i><em>\"+r.caseQty+\" &times; \"+r.unitOz+\" oz</em></li>\";\n    }).join(\"\");\n  }\n  sample();\n  var reduce = window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  if (!reduce){\n    setInterval(sample, 4200);\n  }\n});\n"], "cls": "", "style": ""}, "shop": {"title": "Catalog \u2014 American Food &amp; Beverage", "body": "\n\n  <div style=\"padding-top:2rem\">\n    <span class=\"eyebrow\" data-mode-eyebrow>Catalog</span>\n    <h1 style=\"font-size:clamp(2rem,4vw,3rem)\" data-mode-title>Everything we pack</h1>\n    <p style=\"color:var(--ink-soft)\" data-mode-blurb></p>\n  </div>\n\n  <div class=\"toolbar\">\n    <div class=\"grow\">\n      <label for=\"q\">Search by name or item number</label>\n      <input type=\"search\" id=\"q\" placeholder=\"cashew roasted salted, or 2810501\">\n    </div>\n    <div style=\"flex:0 1 200px\">\n      <label for=\"fmt\">Packaging</label>\n      <select id=\"fmt\"><option value=\"\">All formats</option></select>\n    </div>\n    <div style=\"flex:0 1 180px\">\n      <label for=\"sort\">Sort</label>\n      <select id=\"sort\">\n        <option value=\"name\">Name A\u2013Z</option>\n        <option value=\"item\">Item number</option>\n        <option value=\"oz\">Unit weight</option>\n        <option value=\"price\">Price</option>\n      </select>\n    </div>\n    <div style=\"flex:0 0 auto;align-self:flex-end\">\n      <button class=\"chip\" type=\"button\" id=\"orgToggle\" aria-pressed=\"false\">Organic only</button>\n    </div>\n    <div style=\"flex:0 0 auto;align-self:flex-end\" data-wholesale-only hidden>\n      <button class=\"btn ghost small\" type=\"button\" id=\"csv\">Export CSV</button>\n    </div>\n  </div>\n\n  <div class=\"chiprow\" id=\"cats\" role=\"group\" aria-label=\"Filter by category\"></div>\n\n  <p class=\"count\"><span id=\"count\">\u2014</span> &middot; <span data-wholesale-only hidden class=\"gated\">Pricing shown once your account is approved. <a href=\"#/quote\">Request access</a></span></p>\n  <p class=\"count\" data-wholesale-only hidden id=\"minnote\"></p>\n\n  <!-- retail -->\n  <div class=\"grid\" id=\"grid\" data-retail-only></div>\n\n  <!-- wholesale -->\n  <div class=\"tablewrap\" id=\"sheetwrap\" data-wholesale-only hidden>\n    <table class=\"sheet\" id=\"sheet\">\n      <caption class=\"skip\">Wholesale item sheet</caption>\n      <thead><tr>\n        <th scope=\"col\"><button type=\"button\" data-sort=\"item\">Item # <span class=\"sortmark\"></span></button></th>\n        <th scope=\"col\"><button type=\"button\" data-sort=\"name\">Description <span class=\"sortmark\"></span></button></th>\n        <th scope=\"col\"><button type=\"button\" data-sort=\"category\">Category <span class=\"sortmark\"></span></button></th>\n        <th scope=\"col\"><button type=\"button\" data-sort=\"format\">Packaging <span class=\"sortmark\"></span></button></th>\n        <th scope=\"col\" style=\"text-align:right\"><button type=\"button\" data-sort=\"caseQty\">Case qty <span class=\"sortmark\"></span></button></th>\n        <th scope=\"col\" style=\"text-align:right\"><button type=\"button\" data-sort=\"unitOz\">Unit wt (oz) <span class=\"sortmark\"></span></button></th>\n        <th scope=\"col\" style=\"text-align:right\">Case wt</th>\n        <th scope=\"col\" style=\"text-align:right\"><button type=\"button\" data-sort=\"moq\">Min <span class=\"sortmark\"></span></button></th>\n        <th scope=\"col\">Add</th>\n      </tr></thead>\n      <tbody></tbody>\n    </table>\n  </div>\n\n  <div class=\"empty\" id=\"empty\" hidden>\n    <h3>Nothing matches that yet</h3>\n    <p>Try a shorter search, or clear the category filter. Item numbers work too &mdash; ours all start with 2, 3 or 6.</p>\n    <button class=\"btn ghost\" type=\"button\" id=\"clearAll\">Clear filters</button>\n  </div>\n\n", "scripts": ["\n(function(){\n  var state = { q:\"\", cat:\"\", fmt:\"\", organic:false, sort:\"name\", dir:1 };\n  var ALL = [];\n\n  var params = new URLSearchParams(AFBROUTE.search);\n  if (params.get(\"cat\")) state.cat = params.get(\"cat\");\n  if (params.get(\"fmt\")) state.fmt = params.get(\"fmt\");\n  if (params.get(\"q\"))   state.q   = params.get(\"q\");\n  if (params.get(\"organic\")) state.organic = true;\n  if (params.get(\"mode\")) AFB.setMode(params.get(\"mode\"));\n\n  var $ = function(s){ return document.querySelector(s); };\n\n  AFB.catalog().then(function(data){\n    ALL = data.products;\n\n    $(\"#q\").value = state.q;\n    $(\"#orgToggle\").setAttribute(\"aria-pressed\", String(state.organic));\n\n    $(\"#fmt\").innerHTML = '<option value=\"\">All formats</option>' +\n      data.formats.map(function(f){\n        return '<option value=\"'+f+'\"'+(f===state.fmt?' selected':'')+'>'+f+'</option>';\n      }).join(\"\");\n\n    $(\"#cats\").innerHTML =\n      '<button class=\"chip\" type=\"button\" data-cat=\"\" aria-pressed=\"'+(!state.cat)+'\">All</button>' +\n      data.categories.map(function(c){\n        return '<button class=\"chip\" type=\"button\" data-cat=\"'+c+'\" aria-pressed=\"'+(state.cat===c)+'\">'+c+'</button>';\n      }).join(\"\");\n\n    wire();\n    render();\n  }).catch(function(err){\n    $(\"#grid\").innerHTML = '<div class=\"notice\"><p>The catalog didn\\'t load. Serve this site over http (not a file:// path) and confirm <code>catalog.json</code> sits beside these pages.</p></div>';\n  });\n\n  function wire(){\n    $(\"#q\").addEventListener(\"input\", function(){ state.q = this.value; render(); });\n    $(\"#fmt\").addEventListener(\"change\", function(){ state.fmt = this.value; render(); });\n    $(\"#sort\").addEventListener(\"change\", function(){ state.sort = this.value; state.dir = 1; render(); });\n    $(\"#orgToggle\").addEventListener(\"click\", function(){\n      state.organic = !state.organic;\n      this.setAttribute(\"aria-pressed\", String(state.organic));\n      render();\n    });\n    $(\"#cats\").addEventListener(\"click\", function(e){\n      var b = e.target.closest(\"[data-cat]\"); if (!b) return;\n      state.cat = b.dataset.cat;\n      this.querySelectorAll(\".chip\").forEach(function(c){\n        c.setAttribute(\"aria-pressed\", String(c.dataset.cat === state.cat));\n      });\n      render();\n    });\n    $(\"#clearAll\").addEventListener(\"click\", function(){\n      state = { q:\"\", cat:\"\", fmt:\"\", organic:false, sort:\"name\", dir:1 };\n      $(\"#q\").value = \"\"; $(\"#fmt\").value = \"\"; $(\"#sort\").value = \"name\";\n      $(\"#orgToggle\").setAttribute(\"aria-pressed\",\"false\");\n      $(\"#cats\").querySelectorAll(\".chip\").forEach(function(c){\n        c.setAttribute(\"aria-pressed\", String(c.dataset.cat === \"\"));\n      });\n      render();\n    });\n    $(\"#csv\").addEventListener(\"click\", function(){\n      AFB.download(\"afb-catalog.csv\", AFB.toCSV(filtered()));\n    });\n    document.querySelectorAll(\"[data-sort]\").forEach(function(b){\n      b.addEventListener(\"click\", function(){\n        var k = b.dataset.sort;\n        state.dir = (state.sort === k) ? -state.dir : 1;\n        state.sort = k;\n        render();\n      });\n    });\n    AFBNAV.on(\"afb:mode\", render);\n  }\n\n  function filtered(){\n    var rows = ALL.filter(function(p){\n      if (state.cat && p.category !== state.cat) return false;\n      if (state.fmt && p.format !== state.fmt) return false;\n      if (state.organic && !p.organic) return false;\n      return AFB.matches(p, state.q);\n    });\n    var k = state.sort, d = state.dir;\n    rows.sort(function(a,b){\n      var x = a[k], y = b[k];\n      if (k === \"oz\") { x = a.unitOz; y = b.unitOz; }\n      if (typeof x === \"string\") return d * x.localeCompare(y);\n      return d * (x - y);\n    });\n    return rows;\n  }\n\n  function render(){\n    var mode = AFB.getMode(), rows = filtered();\n\n    document.querySelectorAll(\"[data-retail-only]\").forEach(function(el){ el.hidden = mode !== \"retail\"; });\n    document.querySelectorAll(\"[data-wholesale-only]\").forEach(function(el){ el.hidden = mode !== \"wholesale\"; });\n\n    $(\"[data-mode-eyebrow]\").textContent = mode === \"wholesale\" ? \"Item sheet\" : \"Catalog\";\n    $(\"[data-mode-title]\").textContent  = mode === \"wholesale\" ? \"Every item, every case pack\" : \"Everything we pack\";\n    $(\"[data-mode-blurb]\").textContent  = mode === \"wholesale\"\n      ? \"Sort any column, filter down, export what you need. Add items to a quote request and we'll price them against your volume.\"\n      : \"Filter by what it is or how it's packed. Every jar, cup and container we fill.\";\n\n    $(\"#count\").textContent = rows.length + \" of \" + ALL.length + \" items\";\n    var m = AFB.minimums();\n    if (m) $(\"#minnote\").textContent =\n      \"Sold by the case. Opening order minimum \" + m.wholesale.orderCases +\n      \" cases or \" + m.wholesale.orderWeightLb + \" lb, whichever you hit first.\";\n    $(\"#empty\").hidden = rows.length > 0;\n    if (mode === \"retail\") { $(\"#grid\").hidden = rows.length === 0; }\n    else { $(\"#sheetwrap\").hidden = rows.length === 0; }\n\n    document.querySelectorAll(\".sortmark\").forEach(function(s){ s.textContent = \"\"; });\n    var active = document.querySelector('[data-sort=\"'+state.sort+'\"] .sortmark');\n    if (active) active.textContent = state.dir > 0 ? \"\u25b2\" : \"\u25bc\";\n\n    if (mode === \"retail\") renderGrid(rows); else renderSheet(rows);\n  }\n\n  function renderGrid(rows){\n    $(\"#grid\").innerHTML = rows.slice(0,300).map(function(p){\n      return '<article class=\"card\">' +\n        '<a class=\"thumb\" href=\"#/product?item='+encodeURIComponent(p.item)+'\" aria-label=\"'+esc(p.name)+'\">' +\n          '<span class=\"glyph\" aria-hidden=\"true\">'+AFB.glyph(p.category)+'</span></a>' +\n        '<div class=\"body\">' +\n          '<h3><a href=\"#/product?item='+encodeURIComponent(p.item)+'\">'+esc(p.name)+'</a></h3>' +\n          '<div class=\"meta\">'+p.unitOz+' oz &middot; '+esc(p.format)+'</div>' +\n          (p.organic ? '<div style=\"margin-bottom:.6rem\"><span class=\"flag organic\">Organic</span><span class=\"flag kosher\">OU Kosher</span></div>'\n                     : '<div style=\"margin-bottom:.6rem\"><span class=\"flag kosher\">OU Kosher</span></div>') +\n          '<div class=\"foot\"><span class=\"price\">'+AFB.money(p.price)+'</span>' +\n          '<button class=\"btn small\" type=\"button\" data-add=\"'+p.item+'\">Add</button></div>' +\n        '</div></article>';\n    }).join(\"\");\n    var note = $(\"#overflow\");\n    if (!note){\n      note = document.createElement(\"p\");\n      note.id = \"overflow\"; note.className = \"count\"; note.style.marginTop = \"1rem\";\n      note.textContent = \"Showing the first 300. Narrow the search to see the rest.\";\n      $(\"#grid\").insertAdjacentElement(\"afterend\", note);\n    }\n    note.hidden = rows.length <= 300;\n  }\n\n  function renderSheet(rows){\n    var tb = $(\"#sheet\").querySelector(\"tbody\");\n    tb.innerHTML = rows.map(function(p){\n      return '<tr>' +\n        '<td class=\"sku\">'+p.item+'</td>' +\n        '<td class=\"desc\"><a href=\"#/product?item='+encodeURIComponent(p.item)+'\">'+esc(p.name)+'</a>' +\n          (p.organic ? ' <span class=\"flag organic\">Org</span>' : '') + '</td>' +\n        '<td>'+esc(p.category)+'</td>' +\n        '<td>'+esc(p.format)+'</td>' +\n        '<td class=\"num\">'+p.caseQty+'</td>' +\n        '<td class=\"num\">'+p.unitOz+'</td>' +\n        '<td class=\"num\">'+(p.caseWeightOz/16).toFixed(1)+' lb</td>' +\n        '<td class=\"moq\">'+p.moq+'</td>' +\n        '<td><button class=\"btn ghost small\" type=\"button\" data-quote=\"'+p.item+'\" data-moq=\"'+p.moq+'\">+ Quote</button></td>' +\n      '</tr>';\n    }).join(\"\");\n  }\n\n  AFBNAV.on(\"click\", function(e){\n    var add = e.target.closest(\"[data-add]\");\n    if (add){ AFB.addToCart(add.dataset.add, 1); flash(add, \"Added\"); }\n    var q = e.target.closest(\"[data-quote]\");\n    if (q){\n      var moq = parseInt(q.dataset.moq, 10) || 1;\n      AFB.addToQuote(q.dataset.quote, moq);\n      flash(q, moq > 1 ? moq + \" cases\" : \"On quote\");\n    }\n  });\n\n  function flash(btn, text){\n    var old = btn.textContent;\n    btn.textContent = text; btn.disabled = true;\n    setTimeout(function(){ btn.textContent = old; btn.disabled = false; }, 900);\n  }\n\n  function esc(s){ return String(s).replace(/[&<>\"]/g, function(c){\n    return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\n})();\n"], "cls": "shell", "style": "padding-bottom:2rem"}, "product": {"title": "Product \u2014 American Food &amp; Beverage", "body": "\n  <p class=\"count\" style=\"padding-top:1.5rem\"><a href=\"#/shop\">&larr; Back to the catalog</a></p>\n  <div id=\"pdp\"></div>\n  <div id=\"related\"></div>\n", "scripts": ["\n(function(){\n  var item = new URLSearchParams(AFBROUTE.search).get(\"item\");\n  var P = null;\n\n  AFB.catalog().then(function(data){\n    P = data.products.filter(function(p){ return p.item === item; })[0];\n    if (!P){\n      document.getElementById(\"pdp\").innerHTML =\n        '<div class=\"empty\"><h3>That item number isn\\'t in the catalog</h3>' +\n        '<p>It may have been discontinued or repacked. Search the catalog, or ask us directly.</p>' +\n        '<a class=\"btn ghost\" href=\"#/shop\">Back to the catalog</a></div>';\n      return;\n    }\n    document.title = P.name + \" \u2014 American Food & Beverage\";\n    render();\n    AFBNAV.on(\"afb:mode\", render);\n    related(data.products);\n  });\n\n  function render(){\n    var mode = AFB.getMode();\n    var el = document.getElementById(\"pdp\");\n    el.innerHTML =\n      '<div class=\"pdp\">' +\n        '<div class=\"pdp-visual\"><span class=\"glyph\" aria-hidden=\"true\">'+AFB.glyph(P.category)+'</span></div>' +\n        '<div>' +\n          '<span class=\"eyebrow\">'+esc(P.category)+' &middot; '+esc(P.format)+'</span>' +\n          '<h1>'+esc(P.name)+'</h1>' +\n          '<p style=\"color:var(--ink-soft)\">'+esc(P.blurb)+'</p>' +\n          '<div style=\"margin:.75rem 0 1.25rem\">' +\n            (P.organic ? '<span class=\"flag organic\">USDA Organic</span>' : '') +\n            '<span class=\"flag kosher\">OU Kosher</span>' +\n            '<span class=\"flag kosher\">SQF facility</span>' +\n          '</div>' +\n          (mode === \"retail\" ? retailBlock() : wholesaleBlock()) +\n          specs(mode) +\n        '</div>' +\n      '</div>';\n    wire(mode);\n  }\n\n  function retailBlock(){\n    return '<div class=\"price\">'+AFB.money(P.price)+'</div>' +\n      '<div class=\"per\">'+P.unitOz+' oz container &middot; '+\n        AFB.money(P.price / P.unitOz)+' per oz</div>' +\n      '<div class=\"buyrow\">' +\n        '<label for=\"qty\" class=\"skip\">Quantity</label>' +\n        '<input type=\"text\" inputmode=\"numeric\" id=\"qty\" value=\"1\" aria-label=\"Quantity\">' +\n        '<button class=\"btn\" type=\"button\" id=\"addcart\">Add to cart</button>' +\n      '</div>' +\n      '<p class=\"count\">Ships from Paterson, NJ. Orders in by 2pm go out the same day.</p>';\n  }\n\n  function wholesaleBlock(){\n    return '<div class=\"notice\"><p><b>Pricing is set per account.</b> Case cost depends on volume, ' +\n      'delivery frequency and whether you\\'re taking it in our label or yours. ' +\n      'Add it to a quote and we\\'ll come back with a number and a lead time.</p></div>' +\n      '<div class=\"buyrow\">' +\n        '<label for=\"cases\" class=\"skip\">Cases</label>' +\n        '<input type=\"text\" inputmode=\"numeric\" id=\"cases\" value=\"1\" aria-label=\"Number of cases\">' +\n        '<button class=\"btn\" type=\"button\" id=\"addquote\">Add to quote</button>' +\n        '<a class=\"btn ghost\" href=\"#/quote\">Request pricing access</a>' +\n      '</div>';\n  }\n\n  function specs(mode){\n    var open = mode === \"wholesale\" ? \" open\" : \"\";\n    return '<details class=\"specs\"'+open+'>' +\n      '<summary>Wholesale specs</summary>' +\n      '<div class=\"inner\"><dl class=\"spec\">' +\n        '<dt>Item #</dt><dd>'+P.item+'</dd>' +\n        '<dt>Case qty</dt><dd>'+P.caseQty+' units</dd>' +\n        '<dt>Unit weight</dt><dd>'+P.unitOz+' oz</dd>' +\n        '<dt>Case weight</dt><dd>'+(P.caseWeightOz/16).toFixed(2)+' lb</dd>' +\n        '<dt>Packaging</dt><dd>'+esc(P.format)+'</dd>' +\n        '<dt>Category</dt><dd>'+esc(P.category)+'</dd>' +\n        '<dt>Organic</dt><dd>'+(P.organic ? \"Certified USDA Organic\" : \"Conventional\")+'</dd>' +\n        '<dt>Kosher</dt><dd>OU certified</dd>' +\n        '<dt>Facility</dt><dd>SQF certified, Paterson NJ</dd>' +\n        '<dt>Private label</dt><dd>Available &mdash; <a href=\"#/private-label\">see options</a></dd>' +\n      '</dl></div></details>';\n  }\n\n  function wire(mode){\n    var b = document.getElementById(mode === \"retail\" ? \"addcart\" : \"addquote\");\n    if (!b) return;\n    b.addEventListener(\"click\", function(){\n      var input = document.getElementById(mode === \"retail\" ? \"qty\" : \"cases\");\n      var n = Math.max(1, parseInt(input.value, 10) || 1);\n      if (mode === \"retail\") AFB.addToCart(P.item, n); else AFB.addToQuote(P.item, n);\n      b.textContent = mode === \"retail\" ? \"Added to cart\" : \"Added to quote\";\n      setTimeout(function(){ b.textContent = mode === \"retail\" ? \"Add to cart\" : \"Add to quote\"; }, 1200);\n    });\n  }\n\n  function related(all){\n    var near = all.filter(function(p){\n      return p.category === P.category && p.item !== P.item;\n    }).slice(0,4);\n    if (!near.length) return;\n    var html = '<section class=\"band\"><span class=\"eyebrow\">Also in '+esc(P.category)+'</span>' +\n      '<div class=\"grid\">' + near.map(function(p){\n        return '<article class=\"card\">' +\n          '<a class=\"thumb\" href=\"#/product?item='+encodeURIComponent(p.item)+'\">' +\n          '<span class=\"glyph\" aria-hidden=\"true\">'+AFB.glyph(p.category)+'</span></a>' +\n          '<div class=\"body\"><h3><a href=\"#/product?item='+encodeURIComponent(p.item)+'\">'+esc(p.name)+'</a></h3>' +\n          '<div class=\"meta\">'+p.unitOz+' oz &middot; '+esc(p.format)+'</div></div></article>';\n      }).join(\"\") + '</div></section>';\n    document.getElementById(\"related\").innerHTML = html;\n  }\n\n  function esc(s){ return String(s).replace(/[&<>\"]/g, function(c){\n    return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\n})();\n"], "cls": "shell", "style": ""}, "cart": {"title": "Cart \u2014 American Food &amp; Beverage", "body": "\n  <div id=\"view\"></div>\n", "scripts": ["\n(function(){\n  var BY = {}, SHIP = 9.95, TAX = 0.06625;\n\n  AFB.catalog().then(function(data){\n    data.products.forEach(function(p){ BY[p.item] = p; });\n    render();\n    AFBNAV.on(\"afb:mode\", render);\n  });\n\n  function render(){\n    var el = document.getElementById(\"view\");\n    el.innerHTML = AFB.getMode() === \"wholesale\" ? quoteView() : cartView();\n    wire();\n  }\n\n  /* ---------------- retail ---------------- */\n  function cartView(){\n    var rows = AFB.cart().filter(function(r){ return BY[r.item]; });\n    if (!rows.length) return emptyBlock(\"Your cart is empty\",\n      \"Add a jar of something and it'll show up here.\", \"#/shop\", \"Browse the catalog\");\n\n    var sub = rows.reduce(function(n,r){ return n + BY[r.item].price * r.qty; }, 0);\n    var tax = sub * TAX, total = sub + SHIP + tax;\n\n    return '<span class=\"eyebrow\">Your order</span><h1 style=\"font-size:clamp(2rem,4vw,3rem)\">Cart</h1>' +\n      '<table class=\"plain\"><thead><tr>' +\n        '<th scope=\"col\">Item</th><th scope=\"col\" style=\"text-align:right\">Each</th>' +\n        '<th scope=\"col\" style=\"text-align:right\">Qty</th>' +\n        '<th scope=\"col\" style=\"text-align:right\">Line</th><th scope=\"col\"></th>' +\n      '</tr></thead><tbody>' +\n      rows.map(function(r){\n        var p = BY[r.item];\n        return '<tr>' +\n          '<td><a href=\"#/product?item='+encodeURIComponent(p.item)+'\">'+esc(p.name)+'</a>' +\n            '<div class=\"count\">'+p.unitOz+' oz &middot; '+esc(p.format)+'</div></td>' +\n          '<td class=\"num\">'+AFB.money(p.price)+'</td>' +\n          '<td class=\"num\"><label class=\"skip\" for=\"q'+p.item+'\">Quantity for '+esc(p.name)+'</label>' +\n            '<input id=\"q'+p.item+'\" type=\"text\" inputmode=\"numeric\" value=\"'+r.qty+'\" ' +\n            'data-qty=\"'+p.item+'\" style=\"width:4rem;text-align:right;padding:.3rem .4rem\"></td>' +\n          '<td class=\"num\">'+AFB.money(p.price * r.qty)+'</td>' +\n          '<td><button class=\"linkbtn\" type=\"button\" data-remove=\"'+p.item+'\">Remove</button></td>' +\n        '</tr>';\n      }).join(\"\") + '</tbody></table>' +\n      '<div class=\"totals\">' +\n        '<div><span>Subtotal</span><span>'+AFB.money(sub)+'</span></div>' +\n        '<div><span>Shipping</span><span>'+AFB.money(SHIP)+'</span></div>' +\n        '<div><span>NJ sales tax</span><span>'+AFB.money(tax)+'</span></div>' +\n        '<div class=\"grand\"><span>Total</span><span>'+AFB.money(total)+'</span></div>' +\n      '</div>' +\n      checkoutForm(total);\n  }\n\n  function checkoutForm(total){\n    return '<section class=\"band\" style=\"border-top:1px solid var(--rule);margin-top:2rem\">' +\n      '<span class=\"eyebrow\">Checkout</span>' +\n      '<h2>Where should it go?</h2>' +\n      '<div class=\"panel\" style=\"margin-top:1.25rem\">' +\n      '<form id=\"checkout\" novalidate><div class=\"formgrid\">' +\n        f(\"Full name\",\"name\",\"text\",true) +\n        f(\"Email\",\"email\",\"email\",true) +\n        f(\"Phone\",\"phone\",\"tel\",false) +\n        f(\"Company (optional)\",\"company\",\"text\",false) +\n        '<div class=\"field full\">'+lab(\"Street address\",\"addr\")+'<input id=\"addr\" name=\"addr\" type=\"text\" required></div>' +\n        f(\"City\",\"city\",\"text\",true) +\n        f(\"State\",\"state\",\"text\",true) +\n        f(\"ZIP\",\"zip\",\"text\",true) +\n        '<div class=\"field full\"><label for=\"notes\">Delivery notes</label>' +\n          '<textarea id=\"notes\" name=\"notes\" placeholder=\"Buzzer, loading dock hours, anything we should know\"></textarea></div>' +\n      '</div>' +\n      '<div class=\"notice\" style=\"margin-top:.5rem\"><p><b>Payment runs through your processor.</b> ' +\n      'This step hands off to Stripe, Authorize.net or Magento checkout &mdash; card details are never ' +\n      'collected or stored by this page. Wire the handoff in before going live.</p></div>' +\n      '<button class=\"btn\" type=\"submit\">Place order &middot; '+AFB.money(total)+'</button>' +\n      '<p class=\"count\" style=\"margin-top:.75rem\" id=\"err\" role=\"alert\"></p>' +\n      '</form></div></section>';\n  }\n\n  /* ---------------- wholesale ---------------- */\n  function quoteView(){\n    var rows = AFB.quote().filter(function(r){ return BY[r.item]; });\n    if (!rows.length) return emptyBlock(\"No items on your quote yet\",\n      \"Open the item sheet, mark what you're interested in, and we'll price the whole list at once.\",\n      \"#/shop\", \"Open the item sheet\");\n\n    var cases = rows.reduce(function(n,r){ return n + r.cases; }, 0);\n    var lbs = rows.reduce(function(n,r){ return n + BY[r.item].caseWeightOz * r.cases / 16; }, 0);\n\n    return '<span class=\"eyebrow\">Quote request</span>' +\n      '<h1 style=\"font-size:clamp(2rem,4vw,3rem)\">Your item list</h1>' +\n      '<p style=\"color:var(--ink-soft)\">Send it over and we\\'ll come back with case pricing, ' +\n      'lead times and the minimum for each line. Nothing here is an order.</p>' +\n      '<div style=\"margin:1.25rem 0\"><button class=\"btn ghost small\" type=\"button\" id=\"qcsv\">Export list as CSV</button></div>' +\n      '<div class=\"tablewrap\"><table class=\"sheet\"><thead><tr>' +\n        '<th scope=\"col\">Item #</th><th scope=\"col\">Description</th>' +\n        '<th scope=\"col\">Packaging</th><th scope=\"col\" style=\"text-align:right\">Case qty</th>' +\n        '<th scope=\"col\" style=\"text-align:right\">Cases</th>' +\n        '<th scope=\"col\" style=\"text-align:right\">Est. weight</th><th scope=\"col\"></th>' +\n      '</tr></thead><tbody>' +\n      rows.map(function(r){\n        var p = BY[r.item];\n        return '<tr><td class=\"sku\">'+p.item+'</td>' +\n          '<td class=\"desc\"><a href=\"#/product?item='+encodeURICompone
