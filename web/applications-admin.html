<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>American Food &amp; Beverage — Job Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EFE4CB; --paper:#FBF6E9; --ink:#241A10; --ink-soft:#4a3c2c;
    --olive:#4f5c3a; --olive-deep:#3a4429; --rust:#a3402a; --rust-deep:#7f3121;
    --gold:#c2932f; --line:#d8c79a; --line-strong:#c3ab72; --shadow:0 6px 18px rgba(36,26,16,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  h1,h2,h3{font-family:'Bitter',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 24px 60px;}

  header{background:var(--ink);color:var(--paper);border-bottom:3px solid var(--rust);padding:16px 0;}
  header .wrap{padding:0 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header .top{font-weight:900;font-size:1.2rem;}
  header .bottom{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;}
  .nav-link{color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:0.75rem;text-decoration:none;}

  .kpi-row{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
  .kpi{background:var(--paper);border:1px solid var(--line-strong);border-radius:3px;padding:14px 18px;box-shadow:var(--shadow);min-width:110px;}
  .kpi .n{font-family:'Bitter',serif;font-size:1.6rem;font-weight:900;}
  .kpi .l{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-top:2px;}

  .filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-chip{
    padding:7px 14px;border:1.5px solid var(--line-strong);border-radius:20px;font-size:0.8rem;
    cursor:pointer;background:var(--paper);
  }
  .filter-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line-strong);border-radius:3px;overflow:hidden;box-shadow:var(--shadow);}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);padding:10px 14px;border-bottom:2px solid var(--ink);background:var(--cream);}
  td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:0.88rem;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .muted{color:var(--ink-soft);font-size:0.8rem;}

  select.status-select{
    font-family:'IBM Plex Sans',sans-serif;font-size:0.82rem;padding:6px 8px;border:1.5px solid var(--line-strong);
    border-radius:3px;background:#fff;color:var(--ink);
  }
  .status-badge{font-size:0.72rem;font-weight:700;padding:3px 9px;border-radius:12px;text-transform:capitalize;}
  .status-new{background:#dde7f5;color:#2d4d78;}
  .status-reviewing, .status-under_review{background:#f5edd0;color:#7a5f10;}
  .status-interview{background:#e3d8f0;color:#5a3a7a;}
  .status-hired, .status-approved{background:#dcefd4;color:var(--olive-deep);}
  .status-declined{background:#f2dcd8;color:var(--rust-deep);}
  .status-submitted{background:#dde7f5;color:#2d4d78;}
  .status-withdrawn{background:#e2e2e2;color:#555;}

  .notes-input{width:160px;}
  .loading, .empty{color:var(--ink-soft);font-style:italic;padding:16px;}

  /* Top-level tab switcher between external and internal (employee) apps */
  .mode-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--line-strong);}
  .mode-tab{
    padding:12px 24px;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;text-transform:uppercase;
    letter-spacing:0.05em;cursor:pointer;background:transparent;border:none;color:var(--ink-soft);
    border-bottom:3px solid transparent;margin-bottom:-2px;
  }
  .mode-tab.active{color:var(--ink);border-bottom-color:var(--rust);font-weight:600;}
  .mode-tab .count-pill{
    display:inline-block;margin-left:8px;background:var(--ink);color:var(--paper);
    font-size:0.65rem;padding:2px 7px;border-radius:10px;
  }
  .mode-tab.active .count-pill{background:var(--rust);}
  .sop-chips{display:flex;flex-wrap:wrap;gap:4px;}
  .sop-chip{
    font-family:'IBM Plex Mono',monospace;font-size:0.68rem;background:#e3f0d8;color:var(--olive-deep);
    padding:2px 7px;border-radius:10px;
  }
  .reason-cell{max-width:260px;font-size:0.82rem;color:var(--ink-soft);}
  .reason-cell.full{white-space:normal;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <div class="top">American Food &amp; Beverage</div>
      <div class="bottom">Job Applications</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="/dashboard" class="nav-link">&larr; Dashboard</a>
      <span id="whoami" class="mono" style="font-size:0.75rem;"></span>
      <a href="#" class="nav-link" onclick="logout();return false;">Log out</a>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="mode-tabs">
    <button type="button" class="mode-tab active" data-mode="external" onclick="switchMode('external')">
      External applicants <span class="count-pill" id="extCount">0</span>
    </button>
    <button type="button" class="mode-tab" data-mode="internal" onclick="switchMode('internal')">
      Internal / employee transfers <span class="count-pill" id="intCount">0</span>
    </button>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="filter-row" id="statusFilters"></div>
  <div id="appsTableWrap"><div class="loading">Loading applications&hellip;</div></div>

</div>

<script>
  // Two entirely separate data sets — external applicants come from /api/applications,
  // employee transfer requests come from /employee-applications. They have different
  // status vocabularies and different columns, so they render through different code paths.
  const STATUS_EXTERNAL = ['new', 'reviewing', 'interview', 'hired', 'declined'];
  const STATUS_INTERNAL = ['submitted', 'under_review', 'approved', 'declined', 'withdrawn'];

  let external = [];
  let internal = [];
  let mode = 'external';           // 'external' | 'internal'
  let activeStatusFilter = 'all';

  async function checkAuth() {
    const res = await fetch('/auth/me');
    if (!res.ok) { window.location.href = '/login?next=/applications-admin'; return; }
    const me = await res.json();
    document.getElementById('whoami').textContent = `${me.full_name} (${me.role})`;
  }

  function logout() {
    fetch('/auth/logout', {method: 'POST'}).then(() => window.location.href = '/login');
  }

  // ---------------- Mode switcher ----------------
  function switchMode(next) {
    mode = next;
    activeStatusFilter = 'all';
    document.querySelectorAll('.mode-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.mode === next);
    });
    renderStatusFilters();
    renderCurrent();
    renderKpis();
  }

  function renderStatusFilters() {
    const statuses = mode === 'external' ? STATUS_EXTERNAL : STATUS_INTERNAL;
    document.getElementById('statusFilters').innerHTML =
      `<div class="filter-chip active" data-status="all" onclick="setFilter('all')">All</div>` +
      statuses.map(s => `<div class="filter-chip" data-status="${s}" onclick="setFilter('${s}')">${humanize(s)}</div>`).join('');
  }

  function setFilter(status) {
    activeStatusFilter = status;
    document.querySelectorAll('#statusFilters .filter-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.status === status);
    });
    renderCurrent();
  }

  function humanize(s) { return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }

  // ---------------- KPIs (mode-specific) ----------------
  function renderKpis() {
    const set = mode === 'external' ? external : internal;
    const total = set.length;
    const byStatus = {};
    set.forEach(a => byStatus[a.status] = (byStatus[a.status] || 0) + 1);

    if (mode === 'external') {
      document.getElementById('kpiRow').innerHTML = `
        <div class="kpi"><div class="n">${total}</div><div class="l">Total applicants</div></div>
        <div class="kpi"><div class="n">${byStatus.new || 0}</div><div class="l">New</div></div>
        <div class="kpi"><div class="n">${byStatus.interview || 0}</div><div class="l">Interviewing</div></div>
        <div class="kpi"><div class="n">${byStatus.hired || 0}</div><div class="l">Hired</div></div>
      `;
    } else {
      document.getElementById('kpiRow').innerHTML = `
        <div class="kpi"><div class="n">${total}</div><div class="l">Total requests</div></div>
        <div class="kpi"><div class="n">${byStatus.submitted || 0}</div><div class="l">New</div></div>
        <div class="kpi"><div class="n">${byStatus.under_review || 0}</div><div class="l">Under review</div></div>
        <div class="kpi"><div class="n">${byStatus.approved || 0}</div><div class="l">Approved</div></div>
      `;
    }
    document.getElementById('extCount').textContent = external.length;
    document.getElementById('intCount').textContent = internal.length;
  }

  // ---------------- Load ----------------
  async function loadAll() {
    try {
      const [extRes, intRes] = await Promise.all([
        fetch('/api/applications'),
        fetch('/employee-applications'),
      ]);
      if (extRes.status === 401 || extRes.status === 403) { window.location.href = '/login?next=/applications-admin'; return; }
      external = extRes.ok ? await extRes.json() : [];
      internal = intRes.ok ? await intRes.json() : [];
      renderStatusFilters();
      renderCurrent();
      renderKpis();
    } catch (e) {
      document.getElementById('appsTableWrap').innerHTML = '<div class="empty">Could not load applications.</div>';
    }
  }

  function renderCurrent() {
    if (mode === 'external') renderExternal();
    else renderInternal();
  }

  // ---------------- External applicants (unchanged behavior) ----------------
  function renderExternal() {
    const filtered = activeStatusFilter === 'all'
      ? external
      : external.filter(a => a.status === activeStatusFilter);

    if (!filtered.length) {
      document.getElementById('appsTableWrap').innerHTML = '<div class="empty">No external applications match this filter.</div>';
      return;
    }

    const rows = filtered.map(a => `
      <tr>
        <td>
          <div><strong>${escapeHtml(a.full_name)}</strong></div>
          <div class="muted">${escapeHtml(a.phone)}${a.email ? ' &middot; ' + escapeHtml(a.email) : ''}</div>
          <div class="muted">${escapeHtml(a.city || '')}</div>
        </td>
        <td>${escapeHtml(a.role)}</td>
        <td class="muted">
          ${a.shift_preference ? escapeHtml(a.shift_preference) : '—'}<br>
          ${a.earliest_start ? 'Start: ' + escapeHtml(a.earliest_start) : ''}
          ${a.cdl_class ? '<br>CDL: ' + escapeHtml(a.cdl_class) : ''}
          ${a.resume_filename ? '<br>Resume: ' + escapeHtml(a.resume_filename) : ''}
        </td>
        <td class="muted">${new Date(a.submitted_at).toLocaleDateString()}</td>
        <td>
          <select class="status-select" data-app-id="${a.id}" data-app-type="external">
            ${STATUS_EXTERNAL.map(s => `<option value="${s}" ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </td>
        <td>
          <input class="notes-input" data-notes-id="${a.id}" data-app-type="external"
            placeholder="notes…" value="${escapeAttr(a.notes || '')}">
        </td>
      </tr>
    `).join('');

    document.getElementById('appsTableWrap').innerHTML = `
      <table>
        <thead><tr><th>Applicant</th><th>Position</th><th>Details</th><th>Applied</th><th>Status</th><th>Notes</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    wireRowEvents();
  }

  // ---------------- Internal / employee transfers ----------------
  function renderInternal() {
    const filtered = activeStatusFilter === 'all'
      ? internal
      : internal.filter(a => a.status === activeStatusFilter);

    if (!filtered.length) {
      document.getElementById('appsTableWrap').innerHTML = '<div class="empty">No internal transfer requests match this filter.</div>';
      return;
    }

    const rows = filtered.map(a => {
      const sopChips = (a.acknowledged_sop_codes || [])
        .map(c => `<span class="sop-chip">${escapeHtml(c)}</span>`)
        .join('') || '<span class="muted">none</span>';
      const reason = a.reason || '';
      const reasonShort = reason.length > 120 ? reason.slice(0, 117) + '…' : reason;
      return `
      <tr>
        <td>
          <div><strong>${escapeHtml(a.employee_name)}</strong></div>
          <div class="muted">${escapeHtml(a.employee_email)}${a.employee_phone ? ' &middot; ' + escapeHtml(a.employee_phone) : ''}</div>
          <div class="muted">Since ${escapeHtml(a.hire_date || '—')}</div>
        </td>
        <td>
          <div><strong>${escapeHtml(a.current_role)}</strong></div>
          <div class="muted">${escapeHtml(a.current_department || '')}</div>
          <div class="muted">${a.supervisor_name ? 'Sup: ' + escapeHtml(a.supervisor_name) : ''}</div>
        </td>
        <td>
          <div><strong>${escapeHtml(a.applying_for_role)}</strong></div>
          <div class="muted">${escapeHtml(a.applying_for_department || '')}</div>
          <div class="muted">${a.earliest_start ? 'Start: ' + escapeHtml(a.earliest_start) : ''}${a.shift_preference ? ' &middot; ' + escapeHtml(a.shift_preference) : ''}</div>
        </td>
        <td class="reason-cell" title="${escapeAttr(reason)}">${escapeHtml(reasonShort)}</td>
        <td><div class="sop-chips">${sopChips}</div></td>
        <td class="muted">${new Date(a.submitted_at).toLocaleDateString()}</td>
        <td>
          <select class="status-select" data-app-id="${a.id}" data-app-type="internal">
            ${STATUS_INTERNAL.map(s => `<option value="${s}" ${s === a.status ? 'selected' : ''}>${humanize(s)}</option>`).join('')}
          </select>
        </td>
        <td>
          <input class="notes-input" data-notes-id="${a.id}" data-app-type="internal"
            placeholder="reviewer notes…" value="${escapeAttr(a.notes || '')}">
        </td>
      </tr>
      `;
    }).join('');

    document.getElementById('appsTableWrap').innerHTML = `
      <table>
        <thead><tr>
          <th>Employee</th><th>Current role</th><th>Applying for</th>
          <th>Why (hover for full)</th><th>SOPs ack'd</th><th>Submitted</th><th>Status</th><th>Notes</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    wireRowEvents();
  }

  // ---------------- Row event wiring (one listener, routes by data attributes) ----------------
  function wireRowEvents() {
    document.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', () => {
        const id = parseInt(sel.dataset.appId);
        const type = sel.dataset.appType;
        updateStatus(type, id, sel.value);
      });
    });
    document.querySelectorAll('.notes-input').forEach(inp => {
      inp.addEventListener('blur', () => {
        const id = parseInt(inp.dataset.notesId);
        const type = inp.dataset.appType;
        updateNotes(type, id, inp.value);
      });
    });
  }

  async function updateStatus(type, id, status) {
    if (type === 'external') {
      const a = external.find(x => x.id === id);
      await fetch(`/api/applications/${id}`, {
        method: 'PATCH',
        body: new URLSearchParams({status, notes: (a && a.notes) || ''}),
      });
      if (a) a.status = status;
    } else {
      const a = internal.find(x => x.id === id);
      await fetch(`/employee-applications/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({status, notes: (a && a.notes) || null}),
      });
      if (a) a.status = status;
    }
    renderKpis();
  }

  async function updateNotes(type, id, notes) {
    if (type === 'external') {
      const a = external.find(x => x.id === id);
      await fetch(`/api/applications/${id}`, {
        method: 'PATCH',
        body: new URLSearchParams({status: (a && a.status) || 'new', notes}),
      });
      if (a) a.notes = notes;
    } else {
      const a = internal.find(x => x.id === id);
      await fetch(`/employee-applications/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({status: (a && a.status) || 'submitted', notes}),
      });
      if (a) a.notes = notes;
    }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function escapeAttr(str) {
    return (str || '').replace(/"/g, '&quot;');
  }

  checkAuth();
  loadAll();
</script>

</body>
</html>
