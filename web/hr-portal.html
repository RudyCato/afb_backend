<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFB — HR &amp; Associate Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#EFE4CB;--paper:#FBF6E9;--ink:#241A10;--ink-soft:#5a4a36;
  --rust:#a3402a;--rust-deep:#7f3121;--gold:#c2932f;
  --olive:#4f5c3a;--olive-light:#6b7a4e;
  --hr:#1a6b6e;--hr-light:#2a8a8e;--hr-pale:#e4f2f2;
  --line:#d8c79a;--line-strong:#c3ab72;
  --shadow:0 3px 14px rgba(36,26,16,.10);
  --radius:5px;
  --green:#2d6a4f;--green-pale:#e8f5ef;
  --amber:#b8860b;--amber-pale:#fef9e7;
  --red:#a3402a;--red-pale:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--cream);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}

/* ── Layout shell ── */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
header{
  background:var(--ink);color:var(--paper);border-bottom:3px solid var(--hr);
  padding:13px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.brand{display:flex;flex-direction:column;gap:1px;}
.brand-name{font-family:'Bitter',serif;font-weight:900;font-size:1.05rem;}
.brand-sub{font-family:'IBM Plex Mono',monospace;font-size:0.57rem;letter-spacing:.22em;color:#5cc8cc;text-transform:uppercase;}
.header-right{display:flex;align-items:center;gap:14px;}
.h-user{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:#5cc8cc;letter-spacing:.04em;}
.h-role{
  font-family:'IBM Plex Mono',monospace;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 8px;border-radius:20px;background:var(--hr);color:#e0f7f8;
}
.h-btn{
  font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:rgba(255,255,255,.55);
  text-decoration:none;letter-spacing:.04em;
}
.h-btn:hover{color:#5cc8cc;}

.body{display:flex;flex:1;overflow:hidden;}

/* ── Sidebar nav ── */
.sidebar{
  width:210px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--line-strong);
  display:flex;flex-direction:column;overflow-y:auto;padding:16px 0 24px;
}
.nav-section{padding:10px 16px 4px;font-family:'IBM Plex Mono',monospace;font-size:.58rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:.6;}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;
  font-size:.82rem;font-weight:500;color:var(--ink-soft);border-left:3px solid transparent;
  transition:all .1s;text-decoration:none;
}
.nav-item:hover{background:var(--cream);color:var(--ink);border-left-color:var(--line-strong);}
.nav-item.active{background:var(--hr-pale);color:var(--hr);border-left-color:var(--hr);font-weight:600;}
.nav-item .ni{font-size:1rem;width:18px;text-align:center;}
.nav-badge{
  margin-left:auto;background:var(--rust);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:600;
  padding:1px 6px;border-radius:20px;
}

/* ── Main content pane ── */
.content{flex:1;overflow-y:auto;padding:24px 28px 40px;display:flex;flex-direction:column;gap:20px;}
.hidden{display:none!important;}

/* ── Section header ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;}
.sec-title{font-family:'Bitter',serif;font-size:1.3rem;font-weight:700;}
.sec-sub{font-size:.8rem;color:var(--ink-soft);margin-top:2px;}

/* ── Cards / stat boxes ── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.stat-card{
  background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.stat-card .sv{font-family:'Bitter',serif;font-size:2rem;font-weight:900;color:var(--hr);}
.stat-card .sl{font-size:.74rem;color:var(--ink-soft);margin-top:3px;}

/* ── Panels ── */
.panel{
  background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.panel-head{
  padding:13px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.panel-head h3{font-family:'Bitter',serif;font-size:1rem;font-weight:700;}
.panel-body{padding:16px 18px;}

/* ── Buttons ── */
.btn{
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;
  padding:7px 16px;border-radius:3px;border:none;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;transition:background .1s;
}
.btn-primary{background:var(--hr);color:#fff;}
.btn-primary:hover{background:var(--hr-light);}
.btn-ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft);}
.btn-ghost:hover{border-color:var(--hr);color:var(--hr);}
.btn-rust{background:var(--rust);color:#fff;}
.btn-rust:hover{background:var(--rust-deep);}
.btn-sm{padding:5px 11px;font-size:.63rem;}

/* ── Forms ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.form-grid.cols-1{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
label{font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
input,select,textarea{
  font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;padding:8px 10px;
  border:1px solid var(--line-strong);border-radius:3px;background:var(--cream);color:var(--ink);
  transition:border-color .1s;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--hr);}
textarea{resize:vertical;min-height:80px;}

/* ── Tables ── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th{
  font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);padding:8px 12px;border-bottom:2px solid var(--line-strong);text-align:left;
}
td{padding:9px 12px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--cream);}

/* ── Badges / chips ── */
.badge{
  display:inline-block;padding:2px 8px;border-radius:20px;font-family:'IBM Plex Mono',monospace;font-size:.6rem;
  letter-spacing:.06em;text-transform:uppercase;font-weight:600;
}
.b-green{background:var(--green-pale);color:var(--green);}
.b-red{background:var(--red-pale);color:var(--red);}
.b-amber{background:var(--amber-pale);color:var(--amber);}
.b-blue{background:var(--hr-pale);color:var(--hr);}
.b-grey{background:#e8e4df;color:var(--ink-soft);}

/* ── Announcement cards ── */
.ann-card{
  background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--hr);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  position:relative;
}
.ann-card.pinned{border-left-color:var(--gold);}
.ann-card.vision{border-left-color:var(--rust);}
.ann-card.team_building{border-left-color:var(--olive);}
.ann-card.achievement{border-left-color:#6a5acd;}
.ann-card.safety{border-left-color:var(--amber);}
.ann-card .ann-cat{
  font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;
}
.ann-card h4{font-family:'Bitter',serif;font-size:1rem;font-weight:700;margin-bottom:6px;}
.ann-card p{font-size:.82rem;line-height:1.55;color:var(--ink-soft);}
.ann-card .ann-meta{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--line-strong);margin-top:10px;}
.ann-pin{position:absolute;top:10px;right:12px;font-size:.7rem;}
.ann-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}

/* ── Training module cards ── */
.mod-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:12px;
}
.mod-icon{font-size:1.5rem;flex-shrink:0;margin-top:2px;}
.mod-info{flex:1;}
.mod-info h4{font-family:'Bitter',serif;font-size:.92rem;font-weight:700;}
.mod-info p{font-size:.76rem;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.mod-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.mod-grid{display:flex;flex-direction:column;gap:10px;}

/* ── Profile ── */
.profile-header{
  display:flex;align-items:center;gap:20px;
  background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:22px 24px;box-shadow:var(--shadow);
}
.avatar{
  width:72px;height:72px;border-radius:50%;background:var(--hr);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bitter',serif;font-size:1.6rem;color:#fff;font-weight:900;flex-shrink:0;
}
.profile-info h2{font-family:'Bitter',serif;font-size:1.3rem;}
.profile-info .emp-id{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--ink-soft);letter-spacing:.08em;margin-top:2px;}
.profile-info .dept{font-size:.82rem;color:var(--ink-soft);margin-top:4px;}
.profile-tabs{display:flex;gap:0;border-bottom:1px solid var(--line-strong);margin-bottom:16px;}
.ptab{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-soft);
  transition:all .1s;
}
.ptab.active{color:var(--hr);border-bottom-color:var(--hr);}
.ptab:hover{color:var(--ink);}

/* ── Eval form ── */
.rating-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);}
.rating-row:last-child{border-bottom:none;}
.rating-label{font-size:.82rem;flex:1;}
.rating-stars{display:flex;gap:4px;}
.star{font-size:1.2rem;cursor:pointer;color:#ccc;transition:color .1s;}
.star.filled{color:var(--gold);}

/* ── Message thread ── */
.msg-item{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .1s;
}
.msg-item:hover{border-color:var(--hr);}
.msg-item.unread{border-left:3px solid var(--rust);}
.msg-item .msg-subj{font-weight:600;font-size:.88rem;margin-bottom:3px;}
.msg-item .msg-preview{font-size:.77rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-item .msg-meta{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--line-strong);margin-top:6px;display:flex;gap:12px;}
.msg-list{display:flex;flex-direction:column;gap:8px;}

/* ── Onboarding checklist ── */
.ob-step{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
}
.ob-step.done{opacity:.6;}
.ob-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;}
.ob-step.done .ob-check{background:var(--green);border-color:var(--green);color:#fff;}
.ob-info{flex:1;}
.ob-title{font-size:.85rem;font-weight:600;}
.ob-desc{font-size:.74rem;color:var(--ink-soft);margin-top:2px;}
.ob-list{display:flex;flex-direction:column;gap:8px;}

/* ── Utility ── */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.gap-8{gap:8px;}
.mt-4{margin-top:4px;}
.mt-8{margin-top:8px;}
.mt-12{margin-top:12px;}
.mt-16{margin-top:16px;}
.mono{font-family:'IBM Plex Mono',monospace;}
.dim{color:var(--ink-soft);}
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--paper);
  font-size:.8rem;padding:10px 18px;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.3);
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;max-width:320px;
}
.toast.show{opacity:1;}
.loading{text-align:center;padding:40px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:.8rem;}
.empty{text-align:center;padding:32px;color:var(--ink-soft);font-size:.85rem;}

/* ── Modal ── */
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(36,26,16,.5);z-index:1000;
  align-items:center;justify-content:center;
}
.modal-bg.open{display:flex;}
.modal{
  background:var(--paper);border-radius:var(--radius);box-shadow:0 8px 40px rgba(0,0,0,.25);
  width:90%;max-width:560px;max-height:90vh;overflow-y:auto;
}
.modal-head{
  padding:16px 20px;border-bottom:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{font-family:'Bitter',serif;font-size:1.05rem;}
.modal-close{background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--ink-soft);}
.modal-body{padding:20px;}
.modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

@media(max-width:700px){
  .sidebar{display:none;}
  .form-grid{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div class="shell">

<!-- ── HEADER ── -->
<header>
  <div class="brand">
    <div class="brand-name">American Food &amp; Beverage</div>
    <div class="brand-sub">HR &amp; Associate Portal</div>
  </div>
  <div class="header-right">
    <span class="h-user" id="hUserName">Loading…</span>
    <span class="h-role" id="hRoleBadge">—</span>
    <a href="/ops" class="h-btn">Ops Hub</a>
    <a href="#" class="h-btn" onclick="doLogout()">Sign Out</a>
  </div>
</header>

<div class="body">

<!-- ── SIDEBAR ── -->
<nav class="sidebar" id="sidebar">
  <!-- admin nav items injected here by JS -->
</nav>

<!-- ── CONTENT ── -->
<div class="content" id="mainContent">
  <div class="loading">Loading portal…</div>
</div>

</div><!-- .body -->
</div><!-- .shell -->

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<!-- ── NEW ANNOUNCEMENT MODAL ── -->
<div class="modal-bg" id="annModal">
  <div class="modal">
    <div class="modal-head">
      <h3>New Announcement</h3>
      <button class="modal-close" onclick="closeModal('annModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid cols-1">
        <div class="field"><label>Title</label><input id="annTitle" placeholder="Announcement title"></div>
        <div class="field">
          <label>Category</label>
          <select id="annCategory">
            <option value="general">General</option>
            <option value="vision">Company Vision</option>
            <option value="team_building">Team Building</option>
            <option value="achievement">Achievement 🏆</option>
            <option value="policy">Policy Update</option>
            <option value="safety">Safety</option>
            <option value="sqf">SQF / Quality</option>
          </select>
        </div>
        <div class="field"><label>Emoji (optional)</label><input id="annEmoji" placeholder="🎉" maxlength="4"></div>
        <div class="field">
          <label>Body</label>
          <textarea id="annBody" rows="5" placeholder="Share your message with the team…"></textarea>
        </div>
        <div class="field row">
          <label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:.8rem;">
            <input type="checkbox" id="annPinned" style="width:auto;"> Pin to top
          </label>
        </div>
        <div class="field"><label>Expires (optional)</label><input type="date" id="annExpires"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('annModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveAnnouncement()">Post Announcement</button>
    </div>
  </div>
</div>

<!-- ── NEW MODULE MODAL ── -->
<div class="modal-bg" id="modModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Add Training Module</h3>
      <button class="modal-close" onclick="closeModal('modModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Module Code</label><input id="modCode" placeholder="TRN-001"></div>
        <div class="field">
          <label>Category</label>
          <select id="modCat">
            <option value="onboarding">Onboarding</option>
            <option value="safety">Food Safety</option>
            <option value="sop">SOP</option>
            <option value="sqf">SQF</option>
            <option value="quality">Quality</option>
            <option value="hr">HR / Policy</option>
          </select>
        </div>
        <div class="field full"><label>Title</label><input id="modTitle" placeholder="Module title"></div>
        <div class="field full"><label>Description</label><textarea id="modDesc" rows="3"></textarea></div>
        <div class="field full"><label>Content URL (optional)</label><input id="modUrl" placeholder="https://…"></div>
        <div class="field"><label>Est. Duration (min)</label><input id="modMins" type="number" value="30" min="5"></div>
        <div class="field"><label>Passing Score (%)</label><input id="modScore" type="number" value="80" min="0" max="100"></div>
        <div class="field full row">
          <label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:.8rem;">
            <input type="checkbox" id="modSqfCert" style="width:auto;"> Counts toward SQF Certification
          </label>
        </div>
        <div class="field"><label>Cert Valid Days (0=no expiry)</label><input id="modCertDays" type="number" value="0" min="0"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('modModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveModule()">Add Module</button>
    </div>
  </div>
</div>

<!-- ── NEW MESSAGE MODAL ── -->
<div class="modal-bg" id="msgModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Send Message to HR</h3>
      <button class="modal-close" onclick="closeModal('msgModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid cols-1">
        <div class="field">
          <label>Message Type</label>
          <select id="msgType" onchange="toggleDayOff()">
            <option value="general">General Message</option>
            <option value="day_off">Day-Off Request</option>
            <option value="concern">Concern / Complaint</option>
            <option value="feedback">Feedback / Suggestion</option>
            <option value="schedule">Schedule Change</option>
          </select>
        </div>
        <div class="field"><label>Subject</label><input id="msgSubject" placeholder="What is this about?"></div>
        <div id="dayOffFields" class="hidden">
          <div class="field mt-8"><label>Dates Requested (comma-separated)</label><input id="msgDates" placeholder="2026-08-15, 2026-08-16"></div>
          <div class="field mt-8"><label>Reason</label><input id="msgReason" placeholder="Vacation, appointment, family…"></div>
        </div>
        <div class="field mt-8"><label>Message</label><textarea id="msgBody" rows="5" placeholder="Describe your request…"></textarea></div>
        <div class="field">
          <label>Priority</label>
          <select id="msgPriority">
            <option value="normal">Normal</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('msgModal')">Cancel</button>
      <button class="btn btn-primary" onclick="sendMessage()">Send Message</button>
    </div>
  </div>
</div>

<!-- ── RESPOND TO MESSAGE MODAL ── -->
<div class="modal-bg" id="respondModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Respond to Message</h3>
      <button class="modal-close" onclick="closeModal('respondModal')">✕</button>
    </div>
    <div class="modal-body">
      <div id="respondOriginal" class="panel-body" style="background:var(--cream);border-radius:3px;margin-bottom:14px;font-size:.82rem;"></div>
      <div class="form-grid cols-1">
        <div class="field">
          <label>Status</label>
          <select id="respondStatus">
            <option value="read">Read / Acknowledged</option>
            <option value="approved">Approved ✓</option>
            <option value="denied">Denied ✗</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="field"><label>Response</label><textarea id="respondBody" rows="4" placeholder="Your response to the associate…"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('respondModal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitResponse()">Send Response</button>
    </div>
  </div>
</div>

<!-- ── SELF-EVAL MODAL ── -->
<div class="modal-bg" id="evalModal">
  <div class="modal" style="max-width:640px;">
    <div class="modal-head">
      <h3>Self-Evaluation</h3>

/* ═══════════════════════════════════════════════════════════════════════════

function showSection(name){
  currentSection = name;

  const el = document.getElementById('mainContent');
  el.innerHTML = '<div class="loading">Loading…</div>';
  sections[name]?.();
}

      const now = new Date();
      const soon = new Date(now.getTime() + 30*24*60*60*1000);

      const grouped = {};
      sqfComps.forEach(c=>{
        if(!grouped[c.staff_name]) grouped[c.staff_name]=[];

      c.innerHTML = `

async function api(path, method='GET', body=null){
  const opts = {method, headers:{'Content-Type':'application/json'}, credentials:'include'};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if(!r.ok){
    const t = await r.text();
    let msg;
    try{ msg = JSON.parse(t).detail || t; }catch{ msg = t; }
    throw new Error(msg);
  }
  if(r.status === 204) return null;
  return r.json();
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

let toastTimer;
function toast(msg, type='green'){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderLeft = `4px solid ${type==='red'?'var(--rust)':type==='amber'?'var(--gold)':'#2d6a4f'}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 3500);
}

function err(e){ return `<div class="empty" style="color:var(--rust);">Error: ${e.message}</div>`; }

function initials(name){
  return name.split(' ').map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
}

function badge(val, colorMap){
  const cls = {green:'b-green',amber:'b-amber',red:'b-red',blue:'b-blue',grey:'b-grey'}[colorMap[val]||'grey']||'b-grey';
  return `<span class="badge ${cls}">${val}</span>`;
}

function starDisplay(n){
  return '★'.repeat(n||0)+'☆'.repeat(5-(n||0));
}

function catIcon(cat){
  return {onboarding:'🚀',safety:'🛡',sop:'📋',sqf:'🏅',quality:'🔬',hr:'👥'}[cat]||'📄';
}

async function doLogout(){
  await fetch('/auth/logout',{method:'POST',credentials:'include'});
  window.location.href = '/login';
}

// Close modals on background click
document.querySelectorAll('.modal-bg').forEach(bg=>{
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.classList.remove('open'); });
});
</script>
</body>
