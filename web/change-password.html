<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — American Food & Beverage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:#E8DCC3; --paper:#F4EDDB; --espresso:#2B1D12; --espresso-soft:#4A3626;
    --amber-deep:#A2601C; --forest:#3F5738; --cranberry:#A23B34; --line:#C9B896;
    --shadow:0 8px 24px rgba(43,29,18,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--kraft);color:var(--espresso);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;}
  h1{font-family:'Fraunces',serif;margin:0;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--paper);border:2px solid var(--espresso);border-radius:3px;box-shadow:var(--shadow);
    padding:40px 36px;width:100%;max-width:420px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--amber-deep);font-weight:600;margin-bottom:8px;}
  .card h1{font-size:1.6rem;font-weight:800;margin-bottom:6px;}
  .card p.sub{color:var(--espresso-soft);font-size:0.9rem;margin:0 0 26px;line-height:1.5;}
  label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:6px;color:var(--espresso-soft);}
  input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:2px;font-size:0.98rem;
    background:#fff;color:var(--espresso);margin-bottom:16px;}
  input:focus{outline:none;border-color:var(--espresso);}
  .btn{width:100%;font-family:'IBM Plex Mono',monospace;font-size:0.85rem;text-transform:uppercase;
    letter-spacing:0.05em;padding:14px 24px;border-radius:2px;border:2px solid var(--espresso);
    background:var(--espresso);color:var(--paper);font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--forest);border-color:var(--forest);}
  .btn:disabled{opacity:0.6;cursor:default;}
  .error{background:#fbeceb;border:1.5px solid var(--cranberry);color:var(--cranberry);padding:10px 14px;
    border-radius:2px;font-size:0.85rem;margin-bottom:16px;display:none;}
  .hint{margin-top:16px;font-size:0.78rem;color:var(--espresso-soft);}
  .skip{margin-top:14px;text-align:center;font-size:0.82rem;}
  .skip a{color:var(--espresso-soft);}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="eyebrow" id="modeLabel">Set a new password</div>
    <h1 id="titleText">Change your password</h1>
    <p class="sub" id="subText">You're on a shared starter password — set one only you know before continuing.</p>

    <div class="error" id="err"></div>

    <form id="pwForm">
      <label for="current">Current password</label>
      <input id="current" type="password" autocomplete="current-password" required>

      <label for="new1">New password</label>
      <input id="new1" type="password" autocomplete="new-password" required minlength="8">

      <label for="new2">Confirm new password</label>
      <input id="new2" type="password" autocomplete="new-password" required minlength="8">

      <button class="btn" type="submit" id="submitBtn">Save password</button>
    </form>
    <div class="hint">At least 8 characters. Doesn't need to be fancy — just not the shared one.</div>
    <div class="skip" id="skipRow" style="display:none;">
      <a href="#" id="skipLink">Skip for now</a>
    </div>
  </div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const nextPath = params.get('next') || '/dashboard';

  let forced = false;
  fetch('/auth/me').then(r => r.json()).then(me => {
    forced = !!me.must_change_password;
    if (!forced) {
      document.getElementById('modeLabel').textContent = 'Account settings';
      document.getElementById('titleText').textContent = 'Change your password';
      document.getElementById('subText').textContent = 'Update your password any time.';
      document.getElementById('skipRow').style.display = 'block';
    }
  });

  document.getElementById('skipLink').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = nextPath;
  });

  const form = document.getElementById('pwForm');
  const errBox = document.getElementById('err');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';

    const current = document.getElementById('current').value;
    const new1 = document.getElementById('new1').value;
    const new2 = document.getElementById('new2').value;

    if (new1 !== new2) {
      errBox.textContent = "New passwords don't match.";
      errBox.style.display = 'block';
      return;
    }
    if (new1.length < 8) {
      errBox.textContent = 'New password must be at least 8 characters.';
      errBox.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    try {
      const res = await fetch('/auth/change-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({current_password: current, new_password: new1})
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        errBox.textContent = data.detail || 'Could not change password.';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save password';
        return;
      }
      window.location.href = nextPath;
    } catch (err) {
      errBox.textContent = 'Could not reach the server. Try again.';
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save password';
    }
  });
</script>
</body>
</html>
