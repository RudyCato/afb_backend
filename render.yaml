services:
  - type: web
    name: afb-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: afb-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://afb-backend-58ys.onrender.com"
      - key: COOKIE_SECURE
        value: "true"
      # Optional — only needed if you use the "Backup to cloud" button.
      # Leave blank in the Render dashboard until you have an S3-compatible
      # bucket (AWS S3, Backblaze B2, Cloudflare R2, DigitalOcean Spaces).
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_REGION
        sync: false

databases:
  - name: afb-db
    plan: free
